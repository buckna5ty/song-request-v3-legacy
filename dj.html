<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DCE • REQUESTS</title>
<style>
  :root{
    --bg:#212121;
    --section:#363636;
    --subsection:#424242;
    --border:#2b2b2b;
    --ink:#f2f2f2;
    --muted:#bdbdbd;
    --accent:#1dcec9;
    --amber:#f7b731;
    --danger:#b22222;
    --put:#d81b60;
    --vip:#d4af37;
    --vip-bg:rgba(212,175,55,.10);
    --vip-border:rgba(212,175,55,.55);
    --radius:12px;
    --maxw:1100px;
  }

  @font-face{
    font-family:"Adventor";
    src:url("texgyreadventor-regular.otf") format("opentype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:16px 14px 56px;
  }

  .dce-logo{
    text-align:center;
    margin:14px 0 6px;
  }

  .dce-logo img{
    max-width:min(220px,60vw);
    height:auto;
  }

  .page-title{
    text-align:center;
    margin:0 auto 26px;
    letter-spacing:.06em;
    font-weight:800;
    font-size:clamp(22px,5.5vw,36px);
  }

  .panel{
    background:var(--section);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }

  label{
    display:block;
    font-size:14px;
    color:var(--muted);
    margin:0 0 6px;
  }

  select{
    height:46px;
    border-radius:12px;
    border:1px solid #3a3a3a;
    background:#2a2a2a;
    color:#fff;
    font-size:15px;
    padding:0 12px;
    width:100%;
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .controls-grid{
    display:grid;
    grid-template-columns:1fr 220px 220px;
    gap:12px;
    align-items:end;
  }

  @media (max-width:900px){
    .controls-grid{
      grid-template-columns:1fr;
    }
  }

  .inline-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    min-height:24px;
    flex-wrap:wrap;
  }

  .inline-text{
    font-size:14px;
    font-weight:600;
  }

  .inline-text.good{ color:#34d399; }
  .inline-text.bad{ color:#ef4444; }
  .inline-text.warn{ color:#f7b731; }

  .meta-inline{
    color:#d8d8d8;
    font-size:13px;
  }

  .progress{
    position:relative;
    height:6px;
    flex:1 1 240px;
    max-width:360px;
    background:#2a2a2a;
    border-radius:999px;
    overflow:hidden;
    border:1px solid #333;
    display:none;
  }

  .progress.show{ display:block; }

  .progress::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, rgba(29,206,201,.15) 0%, rgba(29,206,201,.65) 50%, rgba(29,206,201,.15) 100%);
    transform:translateX(-100%);
    animation:bar 1.4s linear infinite;
  }

  @keyframes bar{
    to{ transform:translateX(100%); }
  }

  .spin{
    margin-left:auto;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    border-top-color:#bbb;
    animation:spin .9s linear infinite;
    display:none;
  }

  .spin.show{ display:inline-block; }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .tabs-bar{
    display:flex;
    align-items:flex-end;
    gap:0;
    border-bottom:1px solid var(--border);
    padding:0 6px;
    margin-bottom:10px;
  }

  .tab-btn{
    height:36px;
    padding:0 14px;
    font-size:13px;
    color:#fff;
    background:#2f2f2f;
    border:1px solid var(--border);
    border-bottom:none;
    border-top-left-radius:10px;
    border-top-right-radius:10px;
    margin:0 6px;
    transform:translateY(1px);
    cursor:pointer;
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .tab-btn.active{
    background:var(--subsection);
    transform:translateY(0);
  }

  .hidden{ display:none !important; }

  .collapsible{
    background:var(--subsection);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    margin-top:10px;
  }

  .collapsible-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }

  .twist{
    width:18px;
    height:18px;
    display:grid;
    place-items:center;
    margin-left:8px;
  }

  .collapsible-body{
    display:none;
    margin-top:10px;
  }

  .collapsible.open .collapsible-body{
    display:block;
  }

  .count-pill{
    font-size:13px;
    color:#dcdcdc;
    opacity:.9;
    margin-left:8px;
  }

  .list{
    display:grid;
    gap:10px;
  }

  .card{
    background:var(--section);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    display:grid;
    grid-template-columns:64px 1fr 190px;
    gap:12px;
    align-items:start;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }

  .card.vip-card{
    border-color:var(--vip-border);
    background:
      linear-gradient(0deg, var(--vip-bg), var(--vip-bg)),
      var(--section);
    box-shadow:0 0 0 1px rgba(212,175,55,.18) inset;
  }

  @media (max-width:760px){
    .card{ grid-template-columns:64px 1fr; }
    .card .actions{ grid-column:1/-1; }
  }

  .thumb{
    width:64px;
    height:64px;
    border-radius:10px;
    background:#1f1f1f;
    object-fit:cover;
    display:block;
    align-self:start;
    cursor:pointer;
  }

  .meta{ min-width:0; }

  .title{
    margin:0 0 2px;
    font-weight:800;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#fff;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
  }

  .sub{
    margin:0;
    color:#e6e6e6;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
  }

  .reqline{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
    cursor:pointer;
    user-select:none;
  }

  .reqline .car{
    font-size:18px;
    line-height:1;
    font-weight:800;
    color:#eaeaea;
  }

  .reqline .txt{
    font-size:14px;
    color:#eaeaea;
    font-weight:700;
  }

  .vip-chip{
    display:inline-block;
    margin-top:6px;
    padding:4px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.04em;
    background:rgba(212,175,55,.12);
    border:1px solid rgba(212,175,55,.45);
    color:#f7d774;
  }

  .names-box{
    margin-top:6px;
    background:var(--subsection);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 10px;
    display:none;
  }

  .names-box.open{ display:block; }

  .names-box .hdr{
    color:#cfcfcf;
    font-size:13px;
    margin:0 0 6px;
  }

  .names-list{
    display:grid;
    gap:6px;
  }

  .person-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid #505050;
    border-radius:8px;
    padding:7px 8px;
    background:#3d3d3d;
  }

  .person-left{
    min-width:0;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }

  .person-name{
    color:#fafafa;
    font-size:13px;
    word-break:break-word;
  }

  .vip-star{
    color:var(--vip);
    font-weight:900;
  }

  .person-btn{
    height:26px;
    min-width:88px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid transparent;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .person-btn.vipadd{
    background:#d4af37;
    border-color:#d4af37;
    color:#111;
  }

  .person-btn.vipremove{
    background:#8d6e00;
    border-color:#8d6e00;
    color:#fff;
  }

  .person-btn[disabled]{
    opacity:.65;
    cursor:not-allowed;
  }

  .actions{
    display:grid;
    gap:6px;
    align-self:start;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
    height:30px;
    font-size:12px;
    line-height:1;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 14px rgba(0,0,0,.15);
    width:82%;
    margin:0 auto;
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .btn:hover,
  .person-btn:hover{
    filter:brightness(1.05);
  }

  .btn.played{
    background:var(--accent);
    border-color:var(--accent);
    color:#000;
  }

  .btn.unplayed{
    background:var(--amber);
    border-color:var(--amber);
    color:#000;
  }

  .btn.remove{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }

  .btn.putback{
    background:var(--put);
    border-color:var(--put);
    color:#fff;
  }

  .btn[disabled]{
    opacity:.65;
    cursor:not-allowed;
  }

  .footer-line{
    margin-top:10px;
    color:#fff;
    font-size:12px;
  }

  .empty-state{
    color:#d0d0d0;
    font-size:14px;
    padding:10px 2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dce-logo">
      <img src="assets/dce-logo.png" alt="David Charles Events" onerror="this.style.display='none'">
    </div>

    <div class="page-title">REQUESTS</div>

    <div class="panel">
      <div class="controls-grid">
        <div>
          <label for="eventSel">Select Your Event</label>
          <select id="eventSel"></select>
        </div>

        <div>
          <label for="sortSel">Sort By</label>
          <select id="sortSel">
            <option value="most_requested">Most Requested</option>
            <option value="newest">Newest Request</option>
            <option value="oldest">Oldest Request</option>
            <option value="song_az">Song A–Z</option>
            <option value="artist_az">Artist A–Z</option>
          </select>
        </div>

        <div>
          <label for="filterSel">Filter By</label>
          <select id="filterSel">
            <option value="all">All Requests</option>
            <option value="vip_only">VIP Only</option>
            <option value="non_vip_only">Non-VIP Only</option>
          </select>
        </div>
      </div>

      <div class="inline-row">
        <span id="inlineText" class="inline-text"></span>
        <div id="inlineProgress" class="progress"></div>
        <span id="inlineSpin" class="spin" aria-hidden="true"></span>
        <span id="vipMeta" class="meta-inline"></span>
      </div>
    </div>

    <div class="panel">
      <div class="tabs-bar">
        <button id="tabRequests" class="tab-btn active" type="button">Requests</button>
        <button id="tabSpam" class="tab-btn" type="button">Spam</button>
      </div>

      <div id="tabRequestsPane">
        <div class="collapsible open" id="reqWrap">
          <div class="collapsible-header">
            <div>Requests <span id="reqCount" class="count-pill">(0)</span></div>
            <div class="twist">▾</div>
          </div>
          <div class="collapsible-body">
            <div id="reqList" class="list"></div>
          </div>
        </div>

        <div class="collapsible" id="playedWrap">
          <div class="collapsible-header">
            <div>Played Songs <span id="playedCount" class="count-pill">(0)</span></div>
            <div class="twist">▸</div>
          </div>
          <div class="collapsible-body">
            <div id="playedList" class="list"></div>
          </div>
        </div>

        <div class="collapsible" id="removedWrap">
          <div class="collapsible-header">
            <div>Removed Songs <span id="removedCount" class="count-pill">(0)</span></div>
            <div class="twist">▸</div>
          </div>
          <div class="collapsible-body">
            <div id="removedList" class="list"></div>
          </div>
        </div>

        <div class="footer-line" id="statusLine"></div>
      </div>

      <div id="tabSpamPane" class="hidden">
        <div style="margin:6px 0 10px; font-size:18px; font-weight:800;">
          Spammed Requests <span id="spamCountTop" class="count-pill">(0)</span>
        </div>
        <div id="spamList" class="list"></div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://anaofamvuusuemccfnkp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_oNLSe8ozVcT3hp65fJNcDg_0058Np2C';
const POLL_MS = 5000;

const $ = s => document.querySelector(s);
const eventSel = $('#eventSel');
const sortSel = $('#sortSel');
const filterSel = $('#filterSel');
const inlineText = $('#inlineText');
const inlineProgress = $('#inlineProgress');
const inlineSpin = $('#inlineSpin');
const vipMeta = $('#vipMeta');

const tabRequestsBtn = $('#tabRequests');
const tabSpamBtn = $('#tabSpam');
const tabRequestsPane = $('#tabRequestsPane');
const tabSpamPane = $('#tabSpamPane');

const reqList = $('#reqList');
const playedList = $('#playedList');
const removedList = $('#removedList');
const spamList = $('#spamList');

const reqCountEl = $('#reqCount');
const playedCountEl = $('#playedCount');
const removedCountEl = $('#removedCount');
const spamCountTop = $('#spamCountTop');
const statusLine = $('#statusLine');

let currentCode = '';
let rowsCache = [];
let pollTimer = null;
let isFetchingRows = false;
let isLoadingEvents = false;
let artCache = new Map();
let vipTokenSet = new Set();

function safeString(v){
  return String(v || '').trim();
}

function escapeHTML(s){
  return String(s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function parseEventDate(dateStr){
  const s = safeString(dateStr);
  if (!s) return new Date(NaN);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  return new Date(s);
}

function pad2(n){ return String(n).padStart(2, '0'); }
function dow3(n){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n] || ''; }

function formatHeaderDate(s){
  const d = parseEventDate(s);
  if (isNaN(d)) return '';
  return `${dow3(d.getDay())} ${pad2(d.getMonth()+1)}.${pad2(d.getDate())}.${String(d.getFullYear()).slice(-2)}`;
}

function keySong(song, artist){
  return `${safeString(song).toLowerCase()}|${safeString(artist).toLowerCase()}`;
}

function normalizePlayedStatus(row){
  const s = safeString(row?.played_status).toLowerCase();
  if (s === 'played') return 'played';
  if (s === 'removed') return 'removed';
  return 'not played';
}

function normalizeSpamStatus(row){
  const s = safeString(row?.spam_status).toLowerCase();
  return s || 'clean';
}

function isRowVip(row){
  return !!row?.is_vip;
}

function setVipMeta(){
  vipMeta.textContent = currentCode ? `VIPs for this event: ${vipTokenSet.size}` : '';
}

function showFullLoading(msg='Loading your requests...'){
  inlineText.textContent = msg;
  inlineText.classList.remove('bad', 'warn');
  inlineText.classList.add('good');
  inlineProgress.classList.add('show');
  inlineSpin.classList.remove('show');
}

function showSpinnerOnly(msg=''){
  inlineText.textContent = msg;
  inlineText.classList.remove('good', 'bad', 'warn');
  if (msg) inlineText.classList.add('warn');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.add('show');
}

function clearInline(){
  inlineText.textContent = '';
  inlineText.classList.remove('good', 'bad', 'warn');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.remove('show');
}

function showEventsError(){
  inlineText.textContent = 'Could not load events.';
  inlineText.classList.remove('good', 'warn');
  inlineText.classList.add('bad');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.remove('show');
}

function setStatusMessage(msg, isError = false){
  statusLine.textContent = msg || '';
  statusLine.style.color = isError ? '#ef4444' : '#ffffff';
}

async function rpc(functionName, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
    },
    body: JSON.stringify(body || {})
  });

  const text = await res.text();
  if (!res.ok){
    throw new Error(text || `HTTP ${res.status}`);
  }

  try{
    return JSON.parse(text);
  }catch{
    return [];
  }
}

function spotifyIdFromUrl(url){
  const s = safeString(url);
  if (!s) return null;

  let m = s.match(/^spotify:(track|artist|album):([A-Za-z0-9]+)$/i);
  if (m) return { type: m[1].toLowerCase(), id: m[2] };

  m = s.match(/open\.spotify\.com\/(track|artist|album)\/([A-Za-z0-9]+)/i);
  if (m) return { type: m[1].toLowerCase(), id: m[2] };

  return null;
}

function spotifyUriFromLinkOrSearch({ link, song, artist, kind }){
  const parsed = spotifyIdFromUrl(link);

  if (parsed && parsed.type === kind) return `spotify:${kind}:${parsed.id}`;
  if (kind === 'track' && parsed && parsed.type === 'track') return `spotify:track:${parsed.id}`;

  const sSong = safeString(song);
  const sArtist = safeString(artist);

  if (kind === 'artist'){
    const q = sArtist ? `artist:${sArtist}` : `artist:${sSong}`;
    return `spotify:search:${encodeURIComponent(q)}`;
  }

  if (kind === 'album'){
    const q = sArtist ? `${sSong} ${sArtist}` : sSong;
    return `spotify:search:${encodeURIComponent(q)}`;
  }

  if (sSong && sArtist){
    return `spotify:search:${encodeURIComponent(`track:${sSong} artist:${sArtist}`)}`;
  }

  return `spotify:search:${encodeURIComponent(sSong || sArtist || '')}`;
}

function openSpotifyUri(uri){
  try{
    window.location.href = uri;
  }catch{}
}

async function getArtwork(song, artist){
  const k = keySong(song, artist);
  if (artCache.has(k)) return artCache.get(k);

  try{
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(`${safeString(song)} ${safeString(artist)}`.trim())}&entity=musicTrack&limit=1`;
    const res = await fetch(url);
    const data = await res.json();
    const art = data?.results?.[0]?.artworkUrl100 || data?.results?.[0]?.artworkUrl60 || '';
    artCache.set(k, art || '');
    return art || '';
  }catch{
    artCache.set(k, '');
    return '';
  }
}

async function loadActiveEvents(){
  if (isLoadingEvents) return;
  isLoadingEvents = true;
  showFullLoading('Loading your events...');

  try{
    const list = await rpc('api_list_active_events', {});
    eventSel.innerHTML = '';

    if (!Array.isArray(list) || !list.length){
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'No active events';
      eventSel.appendChild(opt);
      currentCode = '';
      vipTokenSet = new Set();
      setVipMeta();
      showEventsError();
      return;
    }

    for (const ev of list){
      const opt = document.createElement('option');
      opt.value = ev.code;
      const d = formatHeaderDate(ev.date);
      opt.textContent = d ? `${d} - ${ev.name}` : (ev.name || ev.code);
      eventSel.appendChild(opt);
    }

    const pre = safeString(new URLSearchParams(location.search).get('event'));
    if (pre && [...eventSel.options].some(o => o.value === pre)){
      eventSel.value = pre;
    }

    currentCode = eventSel.value || '';
    clearInline();
  }catch{
    showEventsError();
  }finally{
    isLoadingEvents = false;
  }
}

function stopPolling(){
  if (pollTimer){
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(() => {
    fetchRows({ background: true });
  }, POLL_MS);
}

async function fetchRows({ background = false } = {}){
  if (!currentCode) return;
  if (isFetchingRows) return;

  isFetchingRows = true;
  if (!background) showFullLoading('Loading your requests...');
  else showSpinnerOnly('Refreshing...');

  try{
    const [rawRows, vipRows] = await Promise.all([
      rpc('api_read_event_requests', { p_event_code: currentCode }),
      rpc('api_get_event_vips', { p_event_code: currentCode })
    ]);

    rowsCache = Array.isArray(rawRows) ? rawRows.map(x => ({ ...x })) : [];
    vipTokenSet = new Set(
      (Array.isArray(vipRows) ? vipRows : [])
        .map(r => safeString(r.client_token))
        .filter(Boolean)
    );

    renderAll(rowsCache);
    setVipMeta();
    setStatusMessage('');
  }catch{
    setStatusMessage('Connection error.', true);
  }finally{
    isFetchingRows = false;
    clearInline();
  }
}

function splitBuckets(rows){
  const requestMap = new Map();
  const playedMap = new Map();
  const removedMap = new Map();
  const spamMap = new Map();

  for (const row of rows){
    const song = safeString(row.song_title || row.song);
    const artist = safeString(row.artist);
    const link = safeString(row.link);
    const k = keySong(song, artist);
    const playedStatus = normalizePlayedStatus(row);
    const spamStatus = normalizeSpamStatus(row);
    const createdAtMs = row.created_at ? new Date(row.created_at).getTime() : 0;

    if (!song && !artist) continue;

    if (spamStatus !== 'clean'){
      const spamKey = `${k}|${safeString(row.name).toLowerCase()}|${safeString(row.client_token)}|${spamStatus}`;
      let sg = spamMap.get(spamKey);
      if (!sg){
        sg = {
          key: spamKey,
          song,
          artist,
          name: safeString(row.name) || 'Guest',
          client_token: safeString(row.client_token),
          count: 0,
          spam_status: spamStatus,
          is_vip: isRowVip(row),
          created_at_ms: createdAtMs
        };
        spamMap.set(spamKey, sg);
      }
      sg.count += 1;
      if (isRowVip(row)) sg.is_vip = true;
      sg.created_at_ms = Math.max(sg.created_at_ms || 0, createdAtMs || 0);
      continue;
    }

    const targetMap =
      playedStatus === 'played' ? playedMap :
      playedStatus === 'removed' ? removedMap :
      requestMap;

    let g = targetMap.get(k);
    if (!g){
      g = {
        key:k,
        song,
        artist,
        ids:[],
        peopleMap:new Map(),
        link:'',
        hasVip:false,
        newestAtMs: createdAtMs || 0,
        oldestAtMs: createdAtMs || 0
      };
      targetMap.set(k, g);
    }

    g.ids.push(row.id);
    g.newestAtMs = Math.max(g.newestAtMs || 0, createdAtMs || 0);
    g.oldestAtMs = g.oldestAtMs ? Math.min(g.oldestAtMs, createdAtMs || g.oldestAtMs) : (createdAtMs || 0);

    const personToken = safeString(row.client_token);
    const personKey = personToken || `name:${safeString(row.name || 'Guest').toLowerCase()}`;

    if (!g.peopleMap.has(personKey)){
      g.peopleMap.set(personKey, {
        name: safeString(row.name) || 'Guest',
        client_token: personToken,
        isVip: isRowVip(row)
      });
    } else if (isRowVip(row)) {
      g.peopleMap.get(personKey).isVip = true;
    }

    if (!g.link && link) g.link = link;
    if (isRowVip(row)) g.hasVip = true;
  }

  function finalizeGroup(g){
    const people = [...g.peopleMap.values()].sort((a,b) => {
      if (a.isVip !== b.isVip) return a.isVip ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    return {
      key:g.key,
      song:g.song,
      artist:g.artist,
      ids:g.ids,
      people,
      peopleCount: people.length,
      link:g.link,
      hasVip:g.hasVip,
      newestAtMs:g.newestAtMs || 0,
      oldestAtMs:g.oldestAtMs || 0
    };
  }

  const requests = [...requestMap.values()].map(finalizeGroup);
  const played = [...playedMap.values()].map(finalizeGroup);
  const removed = [...removedMap.values()].map(finalizeGroup);
  const spam = [...spamMap.values()].sort((a,b) => (b.created_at_ms || 0) - (a.created_at_ms || 0));

  return { requests, played, removed, spam };
}

function namesBoxHTML(people){
  return `
    <div class="names-box">
      <p class="hdr">Requesters</p>
      <div class="names-list">
        ${people.map(p => {
          const token = safeString(p.client_token);
          const isVip = !!p.isVip;
          return `
            <div class="person-row" data-client-token="${escapeHTML(token)}" data-display-name="${escapeHTML(p.name)}">
              <div class="person-left">
                <span class="person-name">${escapeHTML(p.name)}</span>
                ${isVip ? '<span class="vip-star">★</span>' : ''}
              </div>
              ${token ? `<button class="person-btn ${isVip ? 'vipremove' : 'vipadd'}" type="button" data-role="person-vip-toggle">${isVip ? 'Remove VIP' : 'Add VIP'}</button>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function bindNamesBoxVipButtons(card){
  card.querySelectorAll('[data-role="person-vip-toggle"]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const row = btn.closest('.person-row');
      const token = safeString(row?.dataset.clientToken);
      const displayName = safeString(row?.dataset.displayName);
      if (!token) return;

      const makeVip = !vipTokenSet.has(token);
      card.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = true);
      await setVipForToken(currentCode, token, displayName, makeVip);
      card.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = false);
    };
  });
}

function buildCardBase(obj){
  const guests = obj.peopleCount;
  const el = document.createElement('div');
  el.className = `card${obj.hasVip ? ' vip-card' : ''}`;
  el.dataset.key = obj.key;
  el.dataset.ids = JSON.stringify(obj.ids);
  el.dataset.song = obj.song || '';
  el.dataset.artist = obj.artist || '';
  el.dataset.link = obj.link || '';

  el.innerHTML = `
    <img class="thumb" alt="">
    <div class="meta">
      <p class="title" title="Open in Spotify">${escapeHTML(obj.song || 'Unknown Title')}</p>
      <p class="sub" title="Open artist in Spotify">${escapeHTML(obj.artist || 'Unknown Artist')}</p>
      <div class="reqline"><span class="car">▸</span><span class="txt">Requested by ${guests} guest${guests === 1 ? '' : 's'}</span></div>
      ${obj.hasVip ? '<div class="vip-chip">VIP REQUEST</div>' : ''}
      ${namesBoxHTML(obj.people)}
    </div>
    <div class="actions"></div>
  `;

  getArtwork(obj.song, obj.artist).then(src => {
    const img = el.querySelector('.thumb');
    if (img && src){
      img.src = src;
      img.alt = `${obj.song} cover`;
    }
  });

  bindCardInteractions(el);
  return el;
}

function bindCardInteractions(el){
  const box = el.querySelector('.names-box');
  const reqline = el.querySelector('.reqline');
  const car = reqline.querySelector('.car');

  reqline.onclick = () => {
    const open = box.classList.toggle('open');
    car.textContent = open ? '▾' : '▸';
  };

  const titleEl = el.querySelector('.title');
  const artistEl = el.querySelector('.sub');
  const thumbEl = el.querySelector('.thumb');

  titleEl.onclick = () => {
    openSpotifyUri(spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'track'
    }));
  };

  artistEl.onclick = () => {
    openSpotifyUri(spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'artist'
    }));
  };

  thumbEl.onclick = () => {
    openSpotifyUri(spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'album'
    }));
  };

  bindNamesBoxVipButtons(el);
}

function updateCardBase(node, obj){
  const currentlyOpen = node.querySelector('.names-box')?.classList.contains('open');

  node.className = `card${obj.hasVip ? ' vip-card' : ''}`;
  node.dataset.ids = JSON.stringify(obj.ids);
  node.dataset.song = obj.song || '';
  node.dataset.artist = obj.artist || '';
  node.dataset.link = obj.link || '';

  node.querySelector('.title').textContent = obj.song || 'Unknown Title';
  node.querySelector('.sub').textContent = obj.artist || 'Unknown Artist';
  node.querySelector('.txt').textContent = `Requested by ${obj.peopleCount} guest${obj.peopleCount === 1 ? '' : 's'}`;

  const oldChip = node.querySelector('.vip-chip');
  if (obj.hasVip && !oldChip){
    node.querySelector('.reqline').insertAdjacentHTML('afterend', '<div class="vip-chip">VIP REQUEST</div>');
  }
  if (!obj.hasVip && oldChip){
    oldChip.remove();
  }

  node.querySelector('.names-box').outerHTML = namesBoxHTML(obj.people);
  bindCardInteractions(node);

  if (currentlyOpen){
    const box = node.querySelector('.names-box');
    const car = node.querySelector('.reqline .car');
    box.classList.add('open');
    car.textContent = '▾';
  }
}

async function setStatusForIds(ids, status){
  if (!Array.isArray(ids) || !ids.length) return;

  showSpinnerOnly('Updating...');
  setStatusMessage('');

  try{
    for (const id of ids){
      await rpc('api_set_played_status', {
        p_request_id: id,
        p_status: status
      });
    }
    await fetchRows({ background: false });
  }catch{
    setStatusMessage('Could not update request status.', true);
  }finally{
    clearInline();
  }
}

async function setVipForToken(eventCode, clientToken, displayName, makeVip){
  if (!eventCode || !clientToken) return;

  showSpinnerOnly(makeVip ? 'Adding VIP...' : 'Removing VIP...');
  setStatusMessage('');

  try{
    if (makeVip){
      await rpc('api_add_vip', {
        p_event_code: eventCode,
        p_client_token: clientToken,
        p_display_name: displayName || ''
      });
    } else {
      await rpc('api_remove_vip', {
        p_event_code: eventCode,
        p_client_token: clientToken
      });
    }

    await fetchRows({ background: false });
  }catch{
    setStatusMessage('Could not update VIP status.', true);
  }finally{
    clearInline();
  }
}

function attachRequestActions(card){
  const actions = card.querySelector('.actions');
  actions.innerHTML = `
    <button class="btn played" type="button">Mark as Played</button>
    <button class="btn remove" type="button">Remove</button>
  `;

  actions.querySelector('.btn.played').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'played');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = false);
  };

  actions.querySelector('.btn.remove').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'removed');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = false);
  };

  bindNamesBoxVipButtons(card);
}

function attachPlayedActions(card){
  const actions = card.querySelector('.actions');
  actions.innerHTML = `
    <button class="btn unplayed" type="button">Mark as Unplayed</button>
  `;

  actions.querySelector('.btn.unplayed').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'not played');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = false);
  };

  bindNamesBoxVipButtons(card);
}

function attachRemovedActions(card){
  const actions = card.querySelector('.actions');
  actions.innerHTML = `
    <button class="btn putback" type="button">Put Back</button>
  `;

  actions.querySelector('.btn.putback').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'not played');
    actions.querySelectorAll('.btn, .person-btn').forEach(b => b.disabled = false);
  };

  bindNamesBoxVipButtons(card);
}

function renderList(container, items, makeNode, updateNode){
  const existing = new Map();
  Array.from(container.children).forEach(ch => {
    if (ch.dataset?.key) existing.set(ch.dataset.key, ch);
  });

  existing.forEach((node, key) => {
    if (!items.some(it => it.key === key)){
      node.remove();
    }
  });

  if (!items.length){
    container.innerHTML = `<div class="empty-state">No songs in this section.</div>`;
    return;
  }

  if (container.children.length === 1 && container.querySelector('.empty-state')){
    container.innerHTML = '';
  }

  let cursor = container.firstChild;

  for (const it of items){
    let node = existing.get(it.key);
    if (!node){
      node = makeNode(it);
      container.insertBefore(node, cursor || null);
    }else{
      updateNode(node, it);
      if (node !== cursor){
        container.insertBefore(node, cursor || null);
      }
    }
    cursor = node.nextSibling;
  }
}

function applyRequestFilter(items){
  const filter = filterSel.value || 'all';
  if (filter === 'vip_only') return items.filter(x => x.hasVip);
  if (filter === 'non_vip_only') return items.filter(x => !x.hasVip);
  return items;
}

function sortGroupedItems(items){
  const sort = sortSel.value || 'most_requested';
  const arr = [...items];

  arr.sort((a,b) => {
    if (sort === 'newest'){
      return (b.newestAtMs || 0) - (a.newestAtMs || 0) ||
        (b.hasVip ? 1 : 0) - (a.hasVip ? 1 : 0) ||
        b.peopleCount - a.peopleCount ||
        (a.song || '').localeCompare(b.song || '');
    }

    if (sort === 'oldest'){
      return (a.oldestAtMs || 0) - (b.oldestAtMs || 0) ||
        (b.hasVip ? 1 : 0) - (a.hasVip ? 1 : 0) ||
        b.peopleCount - a.peopleCount ||
        (a.song || '').localeCompare(b.song || '');
    }

    if (sort === 'song_az'){
      return (a.song || '').localeCompare(b.song || '') ||
        (a.artist || '').localeCompare(b.artist || '') ||
        ((b.hasVip ? 1 : 0) - (a.hasVip ? 1 : 0));
    }

    if (sort === 'artist_az'){
      return (a.artist || '').localeCompare(b.artist || '') ||
        (a.song || '').localeCompare(b.song || '') ||
        ((b.hasVip ? 1 : 0) - (a.hasVip ? 1 : 0));
    }

    return b.peopleCount - a.peopleCount ||
      (b.hasVip ? 1 : 0) - (a.hasVip ? 1 : 0) ||
      (b.newestAtMs || 0) - (a.newestAtMs || 0) ||
      (a.song || '').localeCompare(b.song || '');
  });

  return arr;
}

function renderAll(rows){
  const { requests, played, removed, spam } = splitBuckets(rows);

  const filteredRequests = applyRequestFilter(requests);
  const filteredPlayed = applyRequestFilter(played);
  const filteredRemoved = applyRequestFilter(removed);

  const sortedReq = sortGroupedItems(filteredRequests);
  const sortedPlayed = sortGroupedItems(filteredPlayed);
  const sortedRemoved = sortGroupedItems(filteredRemoved);

  renderList(reqList, sortedReq,
    (obj) => { const el = buildCardBase(obj); attachRequestActions(el); return el; },
    (node, obj) => { updateCardBase(node, obj); attachRequestActions(node); }
  );

  renderList(playedList, sortedPlayed,
    (obj) => { const el = buildCardBase(obj); attachPlayedActions(el); return el; },
    (node, obj) => { updateCardBase(node, obj); attachPlayedActions(node); }
  );

  renderList(removedList, sortedRemoved,
    (obj) => { const el = buildCardBase(obj); attachRemovedActions(el); return el; },
    (node, obj) => { updateCardBase(node, obj); attachRemovedActions(node); }
  );

  spamList.innerHTML = '';
  if (!spam.length){
    spamList.innerHTML = `<div class="empty-state">No spammed requests.</div>`;
  } else {
    for (const s of spam){
      const el = document.createElement('div');
      el.className = `card${s.is_vip ? ' vip-card' : ''}`;
      el.innerHTML = `
        <img class="thumb" alt="">
        <div class="meta">
          <p class="title">${escapeHTML(s.song || 'Unknown Title')}</p>
          <p class="sub">${escapeHTML(s.artist || 'Unknown Artist')}</p>
          <p class="sub">Requested by ${escapeHTML(s.name || 'Guest')} (x${s.count})${s.is_vip ? ' <span class="vip-star">★</span>' : ''}</p>
          ${s.is_vip ? '<div class="vip-chip">VIP REQUEST</div>' : ''}
        </div>
        <div class="actions"></div>
      `;
      getArtwork(s.song, s.artist).then(src => {
        if (src) el.querySelector('.thumb').src = src;
      });
      spamList.appendChild(el);
    }
  }

  reqCountEl.textContent = `(${sortedReq.length})`;
  playedCountEl.textContent = `(${sortedPlayed.length})`;
  removedCountEl.textContent = `(${sortedRemoved.length})`;
  spamCountTop.textContent = `(${spam.length})`;
}

function initCollapsibles(){
  document.querySelectorAll('.collapsible-header').forEach(h => {
    h.addEventListener('click', () => {
      const p = h.parentElement;
      p.classList.toggle('open');
      const t = h.querySelector('.twist');
      if (t) t.textContent = p.classList.contains('open') ? '▾' : '▸';
    });
  });
}

function setTab(which){
  if (which === 'spam'){
    tabSpamBtn.classList.add('active');
    tabRequestsBtn.classList.remove('active');
    tabSpamPane.classList.remove('hidden');
    tabRequestsPane.classList.add('hidden');
  } else {
    tabRequestsBtn.classList.add('active');
    tabSpamBtn.classList.remove('active');
    tabRequestsPane.classList.remove('hidden');
    tabSpamPane.classList.add('hidden');
  }
}

tabRequestsBtn.addEventListener('click', () => setTab('requests'));
tabSpamBtn.addEventListener('click', () => setTab('spam'));

eventSel.addEventListener('change', async () => {
  currentCode = eventSel.value || '';
  vipTokenSet = new Set();
  setVipMeta();
  await fetchRows({ background:false });
  startPolling();
});

sortSel.addEventListener('change', () => {
  renderAll(rowsCache);
});

filterSel.addEventListener('change', () => {
  renderAll(rowsCache);
});

(async function boot(){
  await loadActiveEvents();
  initCollapsibles();
  setTab('requests');
  if (eventSel.value){
    currentCode = eventSel.value;
    await fetchRows({ background:false });
    startPolling();
  }
})();
</script>
