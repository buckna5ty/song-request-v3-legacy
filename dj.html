<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DCE • REQUESTS</title>
<style>
  :root{
    --bg:#212121;
    --section:#363636;
    --subsection:#424242;
    --border:#2b2b2b;
    --ink:#f2f2f2;
    --muted:#bdbdbd;

    --accent:#1dcec9;
    --amber:#f7b731;
    --danger:#b22222;
    --put:#d81b60;
    --vip:#f4d35e;
    --vip-bg:rgba(244,211,94,.12);
    --vip-border:rgba(244,211,94,.48);

    --radius:12px;
    --maxw:1180px;
  }

  @font-face{
    font-family:"Adventor";
    src:url("texgyreadventor-regular.otf") format("opentype");
    font-weight:400; font-style:normal; font-display:swap;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap{ max-width:var(--maxw); margin:0 auto; padding:16px 14px 56px; }

  .dce-logo{ text-align:center; margin:14px 0 6px; }
  .dce-logo img{ max-width:min(220px,60vw); height:auto; }
  .page-title{
    text-align:center;
    margin:0 auto 26px;
    letter-spacing:.06em;
    font-weight:800;
    font-size:clamp(22px,5.5vw,36px);
  }

  .panel{
    background:var(--section);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }

  label{ display:block; font-size:14px; color:var(--muted); margin:0 0 6px; }

  select{
    height:46px; border-radius:12px; border:1px solid #3a3a3a;
    background:#2a2a2a; color:#fff; font-size:15px; padding:0 12px; width:100%;
  }

  .inline-row{
    display:flex; align-items:center; gap:10px;
    margin-top:8px; min-height:24px;
  }

  .inline-text{ font-size:14px; font-weight:600; }
  .inline-text.good{ color:#34d399; }
  .inline-text.bad{ color:#ef4444; }

  .progress{
    position:relative; height:6px; flex:1 1 240px; max-width:360px;
    background:#2a2a2a; border-radius:999px; overflow:hidden; border:1px solid #333;
    display:none;
  }
  .progress.show{ display:block; }
  .progress::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(29,206,201,.15) 0%, rgba(29,206,201,.65) 50%, rgba(29,206,201,.15) 100%);
    transform:translateX(-100%); animation:bar 1.4s linear infinite;
  }
  @keyframes bar{ to{ transform:translateX(100%); } }

  .spin{
    margin-left:auto; width:18px; height:18px; border-radius:50%;
    border:2px solid rgba(255,255,255,.25); border-top-color:#bbb;
    animation:spin .9s linear infinite; display:none;
  }
  .spin.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .controls-grid{
    display:grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap:12px;
    margin-top:12px;
  }

  .vip-grid{
    display:grid;
    grid-template-columns: 2fr auto auto;
    gap:12px;
    margin-top:14px;
    align-items:end;
  }

  .vip-status{
    margin-top:10px;
    color:#ddd;
    font-size:13px;
  }

  .tabs-bar{
    display:flex; align-items:flex-end; gap:0; border-bottom:1px solid var(--border); padding:0 6px; margin-bottom:10px;
  }
  .tab-btn{
    height:36px; padding:0 14px; font-size:13px; color:#fff;
    background:#2f2f2f; border:1px solid var(--border); border-bottom:none;
    border-top-left-radius:10px; border-top-right-radius:10px;
    margin:0 6px; transform:translateY(1px); cursor:pointer;
  }
  .tab-btn.active{ background:var(--subsection); transform:translateY(0); }
  .hidden{ display:none!important; }

  .collapsible{ background:var(--subsection); border:1px solid var(--border); border-radius:12px; padding:10px; margin-top:10px; }
  .collapsible-header{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
  .twist{ width:18px; height:18px; display:grid; place-items:center; margin-left:8px; }
  .collapsible-body{ display:none; margin-top:10px; }
  .collapsible.open .collapsible-body{ display:block; }
  .count-pill{ font-size:13px; color:#dcdcdc; opacity:.9; margin-left:8px; }

  .list{ display:grid; gap:10px; }

  .card{
    background:var(--section);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    display:grid;
    grid-template-columns:64px 1fr 190px;
    gap:12px;
    align-items:start;
  }

  .card.vip-card{
    background:linear-gradient(180deg, var(--vip-bg) 0%, rgba(54,54,54,.96) 100%);
    border-color:var(--vip-border);
    box-shadow:0 0 0 1px rgba(244,211,94,.18), 0 8px 18px rgba(0,0,0,.18);
  }

  .card.appear{ opacity:0; transform:translateY(8px); }
  .card.appear.card-ready{ transition:opacity .28s ease, transform .28s ease; opacity:1; transform:none; }
  .no-anim *{ transition:none!important; }

  @media (max-width:900px){
    .controls-grid{ grid-template-columns: 1fr 1fr; }
    .vip-grid{ grid-template-columns: 1fr; }
  }

  @media (max-width:760px){
    .card{ grid-template-columns:64px 1fr; }
    .card .actions{ grid-column:1/-1; }
  }

  .thumb{
    width:64px;height:64px;border-radius:10px;background:#1f1f1f;object-fit:cover;display:block; align-self:start;
    cursor:pointer;
  }
  .meta{ min-width:0; }

  .title{
    margin:0 0 2px; font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .sub{
    margin:0; color:#e6e6e6; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }

  .reqline{
    display:flex; align-items:center; gap:10px; margin-top:6px; cursor:pointer; user-select:none; flex-wrap:wrap;
  }
  .reqline .car{ font-size:18px; line-height:1; font-weight:800; color:#eaeaea; }
  .reqline .txt{ font-size:14px; color:#eaeaea; font-weight:700; }

  .vip-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid rgba(244,211,94,.45);
    background:rgba(244,211,94,.12);
    color:var(--vip);
    font-size:11px;
    font-weight:800;
    letter-spacing:.04em;
  }

  .vip-people{
    margin-top:6px;
    font-size:12px;
    color:var(--vip);
  }

  .names-box{ margin-top:6px; background:var(--subsection); border:1px solid var(--border); border-radius:10px; padding:8px 10px; display:none; }
  .names-box.open{ display:block; }
  .names-box .hdr{ color:#cfcfcf; font-size:13px; margin:0 0 4px; }
  .names-box ul{ margin:0; padding-left:18px; }
  .names-box li{ margin:3px 0; color:#fafafa; font-size:13px; }

  .actions{ display:grid; gap:6px; align-self:start; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:0 10px; height:34px; font-size:12px; line-height:1;
    border-radius:8px; border:1px solid transparent; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 14px rgba(0,0,0,.15);
    width:88%; margin:0 auto;
    color:#fff;
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn.played{   background:var(--accent); border-color:var(--accent); color:#000; }
  .btn.unplayed{ background:var(--amber);  border-color:var(--amber);  color:#000; }
  .btn.remove{   background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.putback{  background:var(--put);    border-color:var(--put);    color:#fff; }
  .btn.vipadd{   background:#756212; border-color:#756212; }
  .btn.vipremove{background:#5b5b5b; border-color:#5b5b5b; }
  .btn[disabled]{ opacity:.7; cursor:not-allowed; }

  .footer-line{ margin-top:10px; color:#fff; font-size:12px; }

  .spam-reason{
    margin-top:6px;
    font-size:12px;
    color:#ffb4b4;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dce-logo">
      <img src="assets/dce-logo.png" alt="David Charles Events" onerror="this.style.display='none'">
    </div>
    <div class="page-title">REQUESTS</div>

    <div class="panel">
      <label for="eventSel">Select Your Event</label>
      <select id="eventSel"></select>

      <div class="inline-row">
        <span id="inlineText" class="inline-text"></span>
        <div id="inlineProgress" class="progress"></div>
        <span id="inlineSpin" class="spin" aria-hidden="true"></span>
      </div>

      <div class="controls-grid">
        <div>
          <label for="sortSel">Sort Requests By</label>
          <select id="sortSel">
            <option value="most_requested">Most Requested</option>
            <option value="newest">Newest Request</option>
            <option value="song_az">Song A–Z</option>
            <option value="artist_az">Artist A–Z</option>
          </select>
        </div>

        <div>
          <label for="filterSel">Filter Requests</label>
          <select id="filterSel">
            <option value="all">All Requests</option>
            <option value="vip_only">VIP Only</option>
            <option value="non_vip_only">Non-VIP Only</option>
          </select>
        </div>

        <div>
          <label for="vipFilterSel">Filter by VIP Person</label>
          <select id="vipFilterSel">
            <option value="">All VIPs</option>
          </select>
        </div>

        <div>
          <label for="requesterVipSel">VIP Management</label>
          <select id="requesterVipSel">
            <option value="">Select requester</option>
          </select>
        </div>
      </div>

      <div class="vip-grid">
        <button id="markVipBtn" class="btn vipadd" type="button">Mark as VIP</button>
        <button id="removeVipBtn" class="btn vipremove" type="button">Remove VIP</button>
        <div id="vipStatus" class="vip-status">VIPs for this event: none</div>
      </div>
    </div>

    <div class="panel">
      <div class="tabs-bar">
        <button id="tabRequests" class="tab-btn active" type="button">Requests</button>
        <button id="tabSpam" class="tab-btn" type="button">Spam</button>
      </div>

      <div id="tabRequestsPane">
        <div class="collapsible open" id="reqWrap">
          <div class="collapsible-header" data-target="reqBody">
            <div>Requests <span id="reqCount" class="count-pill">(0)</span></div>
            <div class="twist">▾</div>
          </div>
          <div id="reqBody" class="collapsible-body">
            <div id="reqList" class="list"></div>
          </div>
        </div>

        <div class="collapsible" id="playedWrap">
          <div class="collapsible-header" data-target="playedBody">
            <div>Played Songs <span id="playedCount" class="count-pill">(0)</span></div>
            <div class="twist">▸</div>
          </div>
          <div id="playedBody" class="collapsible-body">
            <div id="playedList" class="list"></div>
          </div>
        </div>

        <div class="collapsible" id="removedWrap">
          <div class="collapsible-header" data-target="removedBody">
            <div>Removed Songs <span id="removedCount" class="count-pill">(0)</span></div>
            <div class="twist">▸</div>
          </div>
          <div id="removedBody" class="collapsible-body">
            <div id="removedList" class="list"></div>
          </div>
        </div>

        <div class="footer-line" id="statusLine"></div>
      </div>

      <div id="tabSpamPane" class="hidden">
        <div style="margin:6px 0 10px; font-size:18px; font-weight:800;">
          Spammed Requests <span id="spamCountTop" class="count-pill">(0)</span>
        </div>
        <div id="spamList" class="list"></div>
      </div>
    </div>
  </div>

<script>
const ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbxh0I4H0szhTlV21aVA9DCMZXNCjIhZBqgiHSjzWnFlpDZQVW_l5FE1T9eUPEWyEmxufg/exec';
const POLL_MS = 5000;
const ACTION_RENDER_LOCK_MS = 1200;
const ACTION_POLL_PAUSE_MS  = 1500;
const BUCKET_HOLD_MS        = 2500;

let renderLockUntil = 0;
let pollTimer = null;
let pollPausedUntil = 0;
function lockRender(){ renderLockUntil = Date.now() + ACTION_RENDER_LOCK_MS; }
function canRender(){ return Date.now() >= renderLockUntil; }
function pausePolling(){
  pollPausedUntil = Date.now() + ACTION_POLL_PAUSE_MS;
  stopPolling();
  setTimeout(()=>{ if(Date.now()>=pollPausedUntil) startPolling(); }, ACTION_POLL_PAUSE_MS);
}

const $ = s => document.querySelector(s);
const eventSel=$('#eventSel');

const inlineText=$('#inlineText');
const inlineProgress=$('#inlineProgress');
const inlineSpin=$('#inlineSpin');

const sortSel=$('#sortSel');
const filterSel=$('#filterSel');
const vipFilterSel=$('#vipFilterSel');
const requesterVipSel=$('#requesterVipSel');
const markVipBtn=$('#markVipBtn');
const removeVipBtn=$('#removeVipBtn');
const vipStatus=$('#vipStatus');

const tabRequestsBtn=$('#tabRequests'), tabSpamBtn=$('#tabSpam');
const tabRequestsPane=$('#tabRequestsPane'), tabSpamPane=$('#tabSpamPane');

const reqList=$('#reqList'), playedList=$('#playedList'), removedList=$('#removedList'), spamList=$('#spamList');
const reqCountEl=$('#reqCount'), playedCountEl=$('#playedCount'), removedCountEl=$('#removedCount'), spamCountTop=$('#spamCountTop');
const statusLine=$('#statusLine');

let currentCode='';
let rowsCache=[];
let vipNames=[];
const artCache=new Map();
const inFlightByKey = new Map();
const bucketHoldByKey = new Map();
let initialRequestsLoaded = false;

function showFullLoading(msg='Loading your requests...'){
  inlineText.textContent = msg;
  inlineText.classList.remove('bad');
  inlineText.classList.add('good');
  inlineProgress.classList.add('show');
  inlineSpin.classList.remove('show');
}
function showSpinnerOnly(){
  inlineText.textContent = '';
  inlineText.classList.remove('good','bad');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.add('show');
}
function clearInline(){
  inlineText.textContent = '';
  inlineText.classList.remove('good','bad');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.remove('show');
}
function showEventsError(){
  inlineText.textContent = 'Could not load events.';
  inlineText.classList.remove('good');
  inlineText.classList.add('bad');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.remove('show');
}

function parseEventDate(dateStr){
  const s = String(dateStr || '').trim();
  if (!s) return new Date(NaN);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  return new Date(s);
}

function pad2(n){ return String(n).padStart(2,'0'); }
function dow3(n){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n]||''; }
function formatHeaderDate(s){
  const d=parseEventDate(s);
  if(isNaN(d))return'';
  return `${dow3(d.getDay())} ${pad2(d.getMonth()+1)}.${pad2(d.getDate())}.${String(d.getFullYear()).slice(-2)}`;
}
function keySong(song,artist){ return `${(song||'').toLowerCase()}|${(artist||'').toLowerCase()}`; }
function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normalizeNameKey(name){ return String(name||'').trim().toLowerCase().replace(/\s+/g,' '); }

function isVipName(name){
  const key = normalizeNameKey(name);
  return !!key && vipNames.some(v => normalizeNameKey(v) === key);
}

function spotifyIdFromUrl(url){
  const s = String(url || '').trim();
  if (!s) return null;

  let m = s.match(/^spotify:(track|artist|album):([A-Za-z0-9]+)$/i);
  if (m) return { type: m[1].toLowerCase(), id: m[2] };

  m = s.match(/open\.spotify\.com\/(track|artist|album)\/([A-Za-z0-9]+)/i);
  if (m) return { type: m[1].toLowerCase(), id: m[2] };

  return null;
}

function spotifyUriFromLinkOrSearch({ link, song, artist, kind }){
  const parsed = spotifyIdFromUrl(link);
  if (parsed && parsed.type === kind) return `spotify:${kind}:${parsed.id}`;
  if (kind === 'track' && parsed && parsed.type === 'track') return `spotify:track:${parsed.id}`;

  const sSong = String(song || '').trim();
  const sArtist = String(artist || '').trim();

  if (kind === 'artist'){
    const q = sArtist ? `artist:${sArtist}` : `artist:${sSong}`;
    return `spotify:search:${encodeURIComponent(q)}`;
  }

  if (kind === 'album'){
    const q = sArtist ? `${sSong} ${sArtist}` : sSong;
    return `spotify:search:${encodeURIComponent(q)}`;
  }

  if (sSong && sArtist){
    return `spotify:search:${encodeURIComponent(`track:${sSong} artist:${sArtist}`)}`;
  }
  return `spotify:search:${encodeURIComponent(sSong || sArtist || '')}`;
}

function openSpotifyUri(uri){
  try{ window.location.href = uri; }catch{}
}

function jsonp(url,params={}){
  const qs=new URLSearchParams(params);
  const cb='cb_'+Math.random().toString(36).slice(2);
  qs.set('callback',cb); qs.set('t',Date.now());
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=url+(url.includes('?')?'&':'?')+qs.toString();
    const kill=setTimeout(()=>{cleanup(); rej(new Error('timeout'));},9000);
    function cleanup(){clearTimeout(kill); try{delete window[cb];}catch{} s.remove();}
    window[cb]=(d)=>{cleanup(); res(d);};
    s.onerror=()=>{cleanup(); rej(new Error('jsonp'));};
    document.body.appendChild(s);
  });
}

async function getArtwork(song,artist){
  const k=keySong(song,artist);
  if(artCache.has(k)) return artCache.get(k);
  try{
    const data=await jsonp('https://itunes.apple.com/search',{term:`${song} ${artist}`.trim(),entity:'musicTrack',limit:1});
    const url=data?.results?.[0]?.artworkUrl100||data?.results?.[0]?.artworkUrl60||'';
    artCache.set(k,url||'');
    return url||'';
  }catch{
    artCache.set(k,'');
    return '';
  }
}

async function loadVipNames(){
  if(!currentCode){
    vipNames = [];
    updateVipUi();
    return;
  }

  try{
    const r = await jsonp(ENDPOINT_URL,{mode:'getVipList',event:currentCode});
    vipNames = Array.isArray(r?.vip_names) ? r.vip_names : [];
  }catch{
    vipNames = [];
  }
  updateVipUi();
}

function updateVipUi(){
  const uniqueRequesters = [...new Set(
    rowsCache
      .map(r => String(r.name || '').trim())
      .filter(Boolean)
      .sort((a,b)=>a.localeCompare(b))
  )];

  requesterVipSel.innerHTML = '<option value="">Select requester</option>' +
    uniqueRequesters.map(name => `<option value="${escapeHTML(name)}">${escapeHTML(name)}</option>`).join('');

  vipFilterSel.innerHTML = '<option value="">All VIPs</option>' +
    vipNames
      .slice()
      .sort((a,b)=>a.localeCompare(b))
      .map(name => `<option value="${escapeHTML(name)}">${escapeHTML(name)}</option>`)
      .join('');

  vipStatus.textContent = vipNames.length
    ? `VIPs for this event: ${vipNames.join(', ')}`
    : 'VIPs for this event: none';
}

async function setVipNameStatus(name, vip){
  if(!currentCode || !name) return;

  showSpinnerOnly();
  try{
    const r = await jsonp(ENDPOINT_URL, {
      mode:'setVipNameStatus',
      event:currentCode,
      name,
      vip: vip ? '1' : '0'
    });

    if(r?.ok){
      vipNames = Array.isArray(r.vip_names) ? r.vip_names : [];
      rowsCache = rowsCache.map(row => {
        const rowName = String(row.name || '').trim();
        return { ...row, is_vip: isVipName(rowName) };
      });
      updateVipUi();
      renderAll(rowsCache);
      statusLine.textContent = vip ? `${name} marked as VIP.` : `${name} removed from VIP.`;
    }else{
      statusLine.textContent = (r && r.error) ? r.error : 'VIP update failed.';
    }
  }catch{
    statusLine.textContent = 'VIP update failed.';
  }finally{
    inlineSpin.classList.remove('show');
  }
}

async function loadActiveEvents(){
  showFullLoading('Loading your events...');
  try{
    const r=await jsonp(ENDPOINT_URL,{mode:'listActive'});
    const list=Array.isArray(r?.events)?r.events:[];
    list.sort((a,b)=>parseEventDate(a.date||0)-parseEventDate(b.date||0));
    eventSel.innerHTML='';

    if(!list.length){
      const opt=document.createElement('option');
      opt.value='';
      opt.textContent='No active events';
      eventSel.appendChild(opt);
      currentCode='';
      vipNames = [];
      updateVipUi();
      showEventsError();
      return;
    }

    for(const ev of list){
      const opt=document.createElement('option');
      opt.value=ev.code;
      const d=formatHeaderDate(ev.date);
      opt.textContent=d?`${d} - ${ev.name}`:(ev.name||ev.code);
      eventSel.appendChild(opt);
    }

    const pre=(new URLSearchParams(location.search).get('event')||'').trim();
    if(pre&&[...eventSel.options].some(o=>o.value===pre)) eventSel.value=pre;
    currentCode=eventSel.value||'';
    clearInline();
  }catch{
    showEventsError();
  }
}

function startPolling(){ stopPolling(); pollTimer=setInterval(()=>fetchRows({background:true}), POLL_MS); }
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }

async function fetchRows({background=false} = {}){
  if(!currentCode) return;
  if(Date.now() < pollPausedUntil) return;

  if (!initialRequestsLoaded || !background) showFullLoading('Loading your requests...');
  else showSpinnerOnly();

  try{
    const r=await jsonp(ENDPOINT_URL,{mode:'read',event:currentCode});
    const raw = Array.isArray(r?.rows)?r.rows:[];
    rowsCache = raw.map(x=>({...x}));
    vipNames = Array.isArray(r?.vip_names) ? r.vip_names : vipNames;

    updateVipUi();
    if (canRender()) renderAll(rowsCache);
    initialRequestsLoaded = true;
  }catch{
    statusLine.textContent='Connection error.';
  } finally{
    if (!background) clearInline();
    else inlineSpin.classList.remove('show');
  }
}

function splitBuckets(rows){
  const bySong=new Map();
  const playedGroups=new Map();
  const removedGroups=new Map();
  const spamRows=[];

  const now = Date.now();

  for(const row of rows){
    const song=row.song_title||row.song||'';
    const artist=row.artist||'';
    const link=row.link||'';
    const key=keySong(song,artist);
    const playedStatus = String(row.played_status || '').toLowerCase() || (row.played ? 'played' : 'not played');
    const isSpam = ['possible_spam','spam'].includes(String(row.spam_status || '').toLowerCase());

    if(inFlightByKey.has(key)){
      const {target}=inFlightByKey.get(key);
      row.played_status = target;
    }

    if(isSpam){
      spamRows.push({
        key: `${row.id || key}|spam`,
        song,
        artist,
        name: row.name || 'Guest',
        reason: row.spam_reason || 'spam_detected',
        count: row.spam_count || 1
      });
      continue;
    }

    let targetMap = null;
    if (playedStatus === 'played') targetMap = playedGroups;
    else if (playedStatus === 'removed') targetMap = removedGroups;
    else targetMap = bySong;

    let g=targetMap.get(key);
    if(!g){
      g={
        key,
        song,
        artist,
        ids:[],
        people:[],
        peopleSet:new Set(),
        vipPeople:[],
        vipPeopleSet:new Set(),
        link:'',
        latestTs:0
      };
      targetMap.set(key,g);
    }

    g.ids.push(row.id);
    const rowName = String(row.name || '').trim();
    if(rowName && !g.peopleSet.has(rowName)){
      g.peopleSet.add(rowName);
      g.people.push(rowName);
      if (isVipName(rowName) && !g.vipPeopleSet.has(rowName)){
        g.vipPeopleSet.add(rowName);
        g.vipPeople.push(rowName);
      }
    }
    if(!g.link && link) g.link = link;

    const ts = new Date(row.timestamp || 0).getTime();
    if (!isNaN(ts) && ts > g.latestTs) g.latestTs = ts;
  }

  function finalize(map){
    return [...map.values()].map(g=>({
      key:g.key,
      song:g.song,
      artist:g.artist,
      ids:g.ids,
      people:g.people,
      vipPeople:g.vipPeople,
      isVip:g.vipPeople.length > 0,
      link:g.link,
      latestTs:g.latestTs
    }));
  }

  let requests = finalize(bySong);
  let played = finalize(playedGroups);
  let removed = finalize(removedGroups);

  if (bucketHoldByKey.size){
    const pinTo = (arrFrom, arrTo, keySetToPin) => {
      for (const key of keySetToPin){
        const idx = arrFrom.findIndex(x=>x.key===key);
        if (idx>=0) arrFrom.splice(idx,1);
      }
      for (const key of keySetToPin){
        if (!arrTo.some(x=>x.key===key)) {
          const rel = rows.filter(r => keySong(r.song_title||r.song, r.artist) === key);
          if (rel.length){
            const base = rel[0];
            const people = [...new Set(rel.map(r => String(r.name || '').trim()).filter(Boolean))];
            const vipPeople = people.filter(isVipName);
            const firstLink = rel.find(r=>r.link)?.link || '';
            const latestTs = Math.max(...rel.map(r => new Date(r.timestamp || 0).getTime()).filter(n=>!isNaN(n)), 0);
            arrTo.push({
              key,
              song:base.song_title||base.song,
              artist:base.artist,
              ids:rel.map(r=>r.id),
              people,
              vipPeople,
              isVip: vipPeople.length > 0,
              link:firstLink,
              latestTs
            });
          }
        }
      }
    };

    const toRequests=new Set(), toPlayed=new Set(), toRemoved=new Set();
    for (const [key,hold] of bucketHoldByKey.entries()){
      if (now > hold.until){ bucketHoldByKey.delete(key); continue; }
      if (hold.bucket==='requests') toRequests.add(key);
      else if (hold.bucket==='played') toPlayed.add(key);
      else if (hold.bucket==='removed') toRemoved.add(key);
    }
    if (toRequests.size) pinTo(played, requests, toRequests), pinTo(removed, requests, toRequests);
    if (toPlayed.size)   pinTo(requests, played, toPlayed), pinTo(removed, played, toPlayed);
    if (toRemoved.size)  pinTo(requests, removed, toRemoved), pinTo(played, removed, toRemoved);
  }

  return { requests, played, removed, spam: spamRows };
}

function namesBoxHTML(names){
  return `<div class="names-box"><p class="hdr">Requesters</p><ul>${names.map(n=>`<li>${escapeHTML(n)}</li>`).join('')}</ul></div>`;
}

function buildCardBase(obj){
  const guests=obj.people.length;
  const el=document.createElement('div');
  el.className='card appear' + (obj.isVip ? ' vip-card' : '');
  el.dataset.key=obj.key;
  el.dataset.ids=JSON.stringify(obj.ids);
  el.dataset.song=obj.song || '';
  el.dataset.artist=obj.artist || '';
  el.dataset.link=obj.link || '';

  const vipBadge = obj.isVip ? `<span class="vip-badge">VIP</span>` : '';
  const vipPeopleLine = obj.vipPeople.length
    ? `<div class="vip-people">VIP requester${obj.vipPeople.length === 1 ? '' : 's'}: ${escapeHTML(obj.vipPeople.join(', '))}</div>`
    : '';

  el.innerHTML=`
    <img class="thumb" alt="">
    <div class="meta">
      <p class="title" title="Open in Spotify">${escapeHTML(obj.song||'Unknown Title')}</p>
      <p class="sub" title="Open artist in Spotify">${escapeHTML(obj.artist||'Unknown Artist')}</p>
      <div class="reqline">
        <span class="car">▸</span>
        <span class="txt">Requested by ${guests} guest${guests===1?'':'s'}</span>
        ${vipBadge}
      </div>
      ${vipPeopleLine}
      ${namesBoxHTML(obj.people)}
    </div>
    <div class="actions"></div>
  `;

  getArtwork(obj.song,obj.artist).then(src=>{
    const img=el.querySelector('.thumb');
    if(src){ img.src=src; img.alt=`${obj.song} cover`; }
  });

  const box=el.querySelector('.names-box');
  const reqline=el.querySelector('.reqline');
  const car=reqline.querySelector('.car');
  reqline.addEventListener('click',()=>{
    const open=box.classList.toggle('open');
    car.textContent=open?'▾':'▸';
  });

  const titleEl = el.querySelector('.title');
  const artistEl = el.querySelector('.sub');
  const thumbEl = el.querySelector('.thumb');

  titleEl.addEventListener('click', ()=>{
    const uri = spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'track'
    });
    openSpotifyUri(uri);
  });

  artistEl.addEventListener('click', ()=>{
    const uri = spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'artist'
    });
    openSpotifyUri(uri);
  });

  thumbEl.addEventListener('click', ()=>{
    const uri = spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'album'
    });
    openSpotifyUri(uri);
  });

  requestAnimationFrame(()=> el.classList.add('card-ready'));
  return el;
}

function updateCardBase(node,obj){
  node.className='card' + (node.classList.contains('appear') ? ' appear' : '') + (obj.isVip ? ' vip-card' : '');
  node.dataset.ids=JSON.stringify(obj.ids);
  node.dataset.song=obj.song || '';
  node.dataset.artist=obj.artist || '';
  node.dataset.link=obj.link || '';

  node.querySelector('.title').textContent=obj.song||'Unknown Title';
  node.querySelector('.sub').textContent=obj.artist||'Unknown Artist';
  node.querySelector('.txt').textContent=`Requested by ${obj.people.length} guest${obj.people.length===1?'':'s'}`;

  let badge = node.querySelector('.vip-badge');
  if (obj.isVip && !badge){
    badge = document.createElement('span');
    badge.className = 'vip-badge';
    badge.textContent = 'VIP';
    node.querySelector('.reqline').appendChild(badge);
  }
  if (!obj.isVip && badge) badge.remove();

  let vipPeopleLine = node.querySelector('.vip-people');
  if (obj.vipPeople.length){
    if (!vipPeopleLine){
      vipPeopleLine = document.createElement('div');
      vipPeopleLine.className = 'vip-people';
      node.querySelector('.meta').insertBefore(vipPeopleLine, node.querySelector('.names-box'));
    }
    vipPeopleLine.textContent = `VIP requester${obj.vipPeople.length === 1 ? '' : 's'}: ${obj.vipPeople.join(', ')}`;
  } else if (vipPeopleLine){
    vipPeopleLine.remove();
  }

  node.querySelector('.names-box').innerHTML=`<p class="hdr">Requesters</p><ul>${obj.people.map(n=>`<li>${escapeHTML(n)}</li>`).join('')}</ul>`;
}

async function setPlayedStatusForKey(key, ids, targetStatus){
  const now=Date.now();
  inFlightByKey.set(key,{target:targetStatus, ts:now});
  bucketHoldByKey.set(key, { bucket: targetStatus === 'played' ? 'played' : (targetStatus === 'removed' ? 'removed' : 'requests'), until: now + BUCKET_HOLD_MS });

  lockRender();
  pausePolling();
  rowsCache = rowsCache.map(r => (ids.includes(r.id) ? {...r, played_status:targetStatus} : r));
  renderAll(rowsCache);

  const card = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
  if (card) card.querySelectorAll('.btn').forEach(b=> b.disabled = true);

  try{
    await Promise.all(ids.map(id => jsonp(ENDPOINT_URL,{mode:'setPlayed',id,status:targetStatus})));
  }catch{}

  const final = inFlightByKey.get(key);
  if (!final || final.ts !== now) return;

  if (card) card.querySelectorAll('.btn').forEach(b=> b.disabled = false);
  inFlightByKey.delete(key);
  await fetchRows({background:true});
}

function attachRequestActions(card){
  const actions=card.querySelector('.actions');
  actions.innerHTML=`
    <button class="btn played" type="button">Mark as Played</button>
    <button class="btn remove" type="button">Remove</button>
  `;
  actions.querySelector('.btn.played').addEventListener('click', ()=>{
    const ids=JSON.parse(card.dataset.ids||'[]');
    setPlayedStatusForKey(card.dataset.key, ids, 'played');
  });
  actions.querySelector('.btn.remove').addEventListener('click', ()=>{
    const ids=JSON.parse(card.dataset.ids||'[]');
    setPlayedStatusForKey(card.dataset.key, ids, 'removed');
  });
}

function attachPlayedActions(card){
  const actions=card.querySelector('.actions');
  actions.innerHTML=`
    <button class="btn unplayed" type="button">Mark as Not Played</button>
  `;
  actions.querySelector('.btn.unplayed').addEventListener('click', ()=>{
    const ids=JSON.parse(card.dataset.ids||'[]');
    setPlayedStatusForKey(card.dataset.key, ids, 'not played');
  });
}

function attachRemovedActions(card){
  const actions=card.querySelector('.actions');
  actions.innerHTML=`
    <button class="btn putback" type="button">Put Back</button>
  `;
  actions.querySelector('.btn.putback').addEventListener('click', ()=>{
    const ids=JSON.parse(card.dataset.ids||'[]');
    setPlayedStatusForKey(card.dataset.key, ids, 'not played');
  });
}

function renderList(container, items, makeNode, updateNode){
  const existing = new Map();
  Array.from(container.children).forEach(ch=> existing.set(ch.dataset.key, ch));
  existing.forEach((node,key)=>{ if(!items.some(it=>it.key===key)) node.remove(); });

  container.classList.add('no-anim');

  let cursor = container.firstChild;
  for(const it of items){
    let node = existing.get(it.key);
    if(!node){
      node = makeNode(it);
      container.insertBefore(node, cursor || null);
    }else{
      updateNode(node,it);
      if(node !== cursor){
        container.insertBefore(node, cursor || null);
      }
    }
    cursor = node.nextSibling;
  }

  requestAnimationFrame(()=> container.classList.remove('no-anim'));
}

function applyRequestFiltersAndSorts(requests){
  let out = [...requests];

  const filterMode = filterSel.value;
  const vipPerson = vipFilterSel.value;

  if (filterMode === 'vip_only'){
    out = out.filter(x => x.isVip);
  } else if (filterMode === 'non_vip_only'){
    out = out.filter(x => !x.isVip);
  }

  if (vipPerson){
    const vipKey = normalizeNameKey(vipPerson);
    out = out.filter(x => x.vipPeople.some(name => normalizeNameKey(name) === vipKey));
  }

  switch (sortSel.value){
    case 'newest':
      out.sort((a,b)=> (b.latestTs || 0) - (a.latestTs || 0) || (a.song||'').localeCompare(b.song||''));
      break;
    case 'song_az':
      out.sort((a,b)=> (a.song||'').localeCompare(b.song||'') || (a.artist||'').localeCompare(b.artist||''));
      break;
    case 'artist_az':
      out.sort((a,b)=> (a.artist||'').localeCompare(b.artist||'') || (a.song||'').localeCompare(b.song||''));
      break;
    case 'most_requested':
    default:
      out.sort((a,b)=> b.people.length - a.people.length || (b.vipPeople.length - a.vipPeople.length) || (a.song||'').localeCompare(b.song||''));
      break;
  }

  return out;
}

function renderAll(rows){
  const {requests, played, removed, spam}=splitBuckets(rows);

  const sortedReq = applyRequestFiltersAndSorts(requests);
  renderList(reqList, sortedReq,
    (obj)=>{ const el=buildCardBase(obj); attachRequestActions(el); return el; },
    (node,obj)=> updateCardBase(node,obj)
  );

  const playedSorted = [...played].sort((a,b)=>(a.song||'').localeCompare(b.song||''));
  renderList(playedList, playedSorted,
    (obj)=>{ const el=buildCardBase(obj); attachPlayedActions(el); return el; },
    (node,obj)=> updateCardBase(node,obj)
  );

  const removedSorted = [...removed].sort((a,b)=>(a.song||'').localeCompare(b.song||''));
  renderList(removedList, removedSorted,
    (obj)=>{ const el=buildCardBase(obj); attachRemovedActions(el); return el; },
    (node,obj)=> updateCardBase(node,obj)
  );

  spamList.innerHTML='';
  for(const s of spam){
    const el=document.createElement('div');
    el.className='card';
    el.dataset.key = s.key;
    el.innerHTML=`
      <img class="thumb" alt="">
      <div class="meta">
        <p class="title">${escapeHTML(s.song||'Unknown Title')}</p>
        <p class="sub">${escapeHTML(s.artist||'Unknown Artist')}</p>
        <p class="sub">Requester: ${escapeHTML(s.name||'Guest')}</p>
        <div class="spam-reason">Reason: ${escapeHTML(s.reason || 'spam_detected')}</div>
      </div>
      <div class="actions"></div>
    `;
    getArtwork(s.song,s.artist).then(src=>{ if(src){ el.querySelector('.thumb').src=src; }});
    spamList.appendChild(el);
  }

  reqCountEl.textContent    = `(${reqList.children.length})`;
  playedCountEl.textContent = `(${playedList.children.length})`;
  removedCountEl.textContent= `(${removedList.children.length})`;
  spamCountTop.textContent  = `(${spamList.children.length})`;
}

function initCollapsibles(){
  document.querySelectorAll('.collapsible-header').forEach(h=>{
    h.addEventListener('click',()=>{
      const p=h.parentElement; p.classList.toggle('open');
      const t=h.querySelector('.twist'); if(t) t.textContent=p.classList.contains('open')?'▾':'▸';
    });
  });
}

function setTab(which){
  if(which==='spam'){
    tabSpamBtn.classList.add('active'); tabRequestsBtn.classList.remove('active');
    tabSpamPane.classList.remove('hidden'); tabRequestsPane.classList.add('hidden');
  } else {
    tabRequestsBtn.classList.add('active'); tabSpamBtn.classList.remove('active');
    tabRequestsPane.classList.remove('hidden'); tabSpamPane.classList.add('hidden');
  }
}
tabRequestsBtn.addEventListener('click',()=>setTab('requests'));
tabSpamBtn.addEventListener('click',()=>setTab('spam'));

sortSel.addEventListener('change', ()=> renderAll(rowsCache));
filterSel.addEventListener('change', ()=> renderAll(rowsCache));
vipFilterSel.addEventListener('change', ()=> renderAll(rowsCache));

markVipBtn.addEventListener('click', async ()=>{
  const name = requesterVipSel.value;
  if (!name){
    statusLine.textContent = 'Select a requester first.';
    return;
  }
  await setVipNameStatus(name, true);
});

removeVipBtn.addEventListener('click', async ()=>{
  const name = requesterVipSel.value || vipFilterSel.value;
  if (!name){
    statusLine.textContent = 'Select a VIP name first.';
    return;
  }
  await setVipNameStatus(name, false);
});

eventSel.addEventListener('change', async ()=>{
  currentCode=eventSel.value||'';
  initialRequestsLoaded = false;
  rowsCache = [];
  vipNames = [];
  updateVipUi();
  await loadVipNames();
  await fetchRows({background:false});
  startPolling();
});

(async function boot(){
  await loadActiveEvents();
  initCollapsibles();
  setTab('requests');

  if(eventSel.value){
    currentCode=eventSel.value;
    initialRequestsLoaded = false;
    await loadVipNames();
    await fetchRows({background:false});
    startPolling();
  }
})();
</script>
