<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DCE • REQUESTS</title>
<style>
  :root{
    --bg:#212121;
    --section:#363636;
    --subsection:#424242;
    --border:#2b2b2b;
    --ink:#f2f2f2;
    --muted:#bdbdbd;
    --accent:#1dcec9;
    --amber:#f7b731;
    --danger:#b22222;
    --put:#d81b60;
    --vip:#d4af37;
    --radius:12px;
    --maxw:1100px;
  }

  @font-face{
    font-family:"Adventor";
    src:url("texgyreadventor-regular.otf") format("opentype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:16px 14px 56px;
  }

  .dce-logo{
    text-align:center;
    margin:14px 0 6px;
  }

  .dce-logo img{
    max-width:min(220px,60vw);
    height:auto;
  }

  .page-title{
    text-align:center;
    margin:0 auto 26px;
    letter-spacing:.06em;
    font-weight:800;
    font-size:clamp(22px,5.5vw,36px);
  }

  .panel{
    background:var(--section);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }

  label{
    display:block;
    font-size:14px;
    color:var(--muted);
    margin:0 0 6px;
  }

  select{
    height:46px;
    border-radius:12px;
    border:1px solid #3a3a3a;
    background:#2a2a2a;
    color:#fff;
    font-size:15px;
    padding:0 12px;
    width:100%;
  }

  .inline-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    min-height:24px;
    flex-wrap:wrap;
  }

  .inline-text{
    font-size:14px;
    font-weight:600;
  }

  .inline-text.good{ color:#34d399; }
  .inline-text.bad{ color:#ef4444; }
  .inline-text.warn{ color:#f7b731; }

  .meta-inline{
    color:#d8d8d8;
    font-size:13px;
  }

  .progress{
    position:relative;
    height:6px;
    flex:1 1 240px;
    max-width:360px;
    background:#2a2a2a;
    border-radius:999px;
    overflow:hidden;
    border:1px solid #333;
    display:none;
  }

  .progress.show{ display:block; }

  .progress::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, rgba(29,206,201,.15) 0%, rgba(29,206,201,.65) 50%, rgba(29,206,201,.15) 100%);
    transform:translateX(-100%);
    animation:bar 1.4s linear infinite;
  }

  @keyframes bar{
    to{ transform:translateX(100%); }
  }

  .spin{
    margin-left:auto;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    border-top-color:#bbb;
    animation:spin .9s linear infinite;
    display:none;
  }

  .spin.show{ display:inline-block; }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .tabs-bar{
    display:flex;
    align-items:flex-end;
    gap:0;
    border-bottom:1px solid var(--border);
    padding:0 6px;
    margin-bottom:10px;
  }

  .tab-btn{
    height:36px;
    padding:0 14px;
    font-size:13px;
    color:#fff;
    background:#2f2f2f;
    border:1px solid var(--border);
    border-bottom:none;
    border-top-left-radius:10px;
    border-top-right-radius:10px;
    margin:0 6px;
    transform:translateY(1px);
    cursor:pointer;
  }

  .tab-btn.active{
    background:var(--subsection);
    transform:translateY(0);
  }

  .hidden{ display:none !important; }

  .collapsible{
    background:var(--subsection);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    margin-top:10px;
  }

  .collapsible-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }

  .twist{
    width:18px;
    height:18px;
    display:grid;
    place-items:center;
    margin-left:8px;
  }

  .collapsible-body{
    display:none;
    margin-top:10px;
  }

  .collapsible.open .collapsible-body{
    display:block;
  }

  .count-pill{
    font-size:13px;
    color:#dcdcdc;
    opacity:.9;
    margin-left:8px;
  }

  .list{
    display:grid;
    gap:10px;
  }

  .card{
    background:var(--section);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    display:grid;
    grid-template-columns:64px 1fr 190px;
    gap:12px;
    align-items:start;
  }

  @media (max-width:760px){
    .card{ grid-template-columns:64px 1fr; }
    .card .actions{ grid-column:1/-1; }
  }

  .thumb{
    width:64px;
    height:64px;
    border-radius:10px;
    background:#1f1f1f;
    object-fit:cover;
    display:block;
    align-self:start;
    cursor:pointer;
  }

  .meta{ min-width:0; }

  .title{
    margin:0 0 2px;
    font-weight:800;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#fff;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
  }

  .sub{
    margin:0;
    color:#e6e6e6;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
  }

  .reqline{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
    cursor:pointer;
    user-select:none;
  }

  .reqline .car{
    font-size:18px;
    line-height:1;
    font-weight:800;
    color:#eaeaea;
  }

  .reqline .txt{
    font-size:14px;
    color:#eaeaea;
    font-weight:700;
  }

  .vip-chip{
    display:inline-block;
    margin-top:6px;
    padding:4px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.04em;
    background:rgba(212,175,55,.12);
    border:1px solid rgba(212,175,55,.45);
    color:#f7d774;
  }

  .names-box{
    margin-top:6px;
    background:var(--subsection);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 10px;
    display:none;
  }

  .names-box.open{ display:block; }

  .names-box .hdr{
    color:#cfcfcf;
    font-size:13px;
    margin:0 0 4px;
  }

  .names-box ul{
    margin:0;
    padding-left:18px;
  }

  .names-box li{
    margin:3px 0;
    color:#fafafa;
    font-size:13px;
  }

  .vip-star{
    color:var(--vip);
    font-weight:900;
    margin-left:6px;
  }

  .actions{
    display:grid;
    gap:6px;
    align-self:start;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
    height:30px;
    font-size:12px;
    line-height:1;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 14px rgba(0,0,0,.15);
    width:82%;
    margin:0 auto;
  }

  .btn:hover{ filter:brightness(1.05); }

  .btn.played{
    background:var(--accent);
    border-color:var(--accent);
    color:#000;
  }

  .btn.unplayed{
    background:var(--amber);
    border-color:var(--amber);
    color:#000;
  }

  .btn.remove{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }

  .btn.putback{
    background:var(--put);
    border-color:var(--put);
    color:#fff;
  }

  .btn[disabled]{
    opacity:.65;
    cursor:not-allowed;
  }

  .footer-line{
    margin-top:10px;
    color:#fff;
    font-size:12px;
  }

  .empty-state{
    color:#d0d0d0;
    font-size:14px;
    padding:10px 2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dce-logo">
      <img src="assets/dce-logo.png" alt="David Charles Events" onerror="this.style.display='none'">
    </div>

    <div class="page-title">REQUESTS</div>

    <div class="panel">
      <label for="eventSel">Select Your Event</label>
      <select id="eventSel"></select>

      <div class="inline-row">
        <span id="inlineText" class="inline-text"></span>
        <div id="inlineProgress" class="progress"></div>
        <span id="inlineSpin" class="spin" aria-hidden="true"></span>
        <span id="vipMeta" class="meta-inline"></span>
      </div>
    </div>

    <div class="panel">
      <div class="tabs-bar">
        <button id="tabRequests" class="tab-btn active" type="button">Requests</button>
        <button id="tabSpam" class="tab-btn" type="button">Spam</button>
      </div>

      <div id="tabRequestsPane">
        <div class="collapsible open" id="reqWrap">
          <div class="collapsible-header">
            <div>Requests <span id="reqCount" class="count-pill">(0)</span></div>
            <div class="twist">▾</div>
          </div>
          <div class="collapsible-body">
            <div id="reqList" class="list"></div>
          </div>
        </div>

        <div class="collapsible" id="playedWrap">
          <div class="collapsible-header">
            <div>Played Songs <span id="playedCount" class="count-pill">(0)</span></div>
            <div class="twist">▸</div>
          </div>
          <div class="collapsible-body">
            <div id="playedList" class="list"></div>
          </div>
        </div>

        <div class="collapsible" id="removedWrap">
          <div class="collapsible-header">
            <div>Removed Songs <span id="removedCount" class="count-pill">(0)</span></div>
            <div class="twist">▸</div>
          </div>
          <div class="collapsible-body">
            <div id="removedList" class="list"></div>
          </div>
        </div>

        <div class="footer-line" id="statusLine"></div>
      </div>

      <div id="tabSpamPane" class="hidden">
        <div style="margin:6px 0 10px; font-size:18px; font-weight:800;">
          Spammed Requests <span id="spamCountTop" class="count-pill">(0)</span>
        </div>
        <div id="spamList" class="list"></div>
      </div>
    </div>
  </div>

<script>
const ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbxh0I4H0szhTlV21aVA9DCMZXNCjIhZBqgiHSjzWnFlpDZQVW_l5FE1T9eUPEWyEmxufg/exec';
const POLL_MS = 5000;
const JSONP_TIMEOUT_MS = 30000;
const ACTION_VERIFY_ATTEMPTS = 8;
const ACTION_VERIFY_DELAY_MS = 1200;

const $ = s => document.querySelector(s);

const eventSel = $('#eventSel');
const inlineText = $('#inlineText');
const inlineProgress = $('#inlineProgress');
const inlineSpin = $('#inlineSpin');
const vipMeta = $('#vipMeta');

const tabRequestsBtn = $('#tabRequests');
const tabSpamBtn = $('#tabSpam');
const tabRequestsPane = $('#tabRequestsPane');
const tabSpamPane = $('#tabSpamPane');

const reqList = $('#reqList');
const playedList = $('#playedList');
const removedList = $('#removedList');
const spamList = $('#spamList');

const reqCountEl = $('#reqCount');
const playedCountEl = $('#playedCount');
const removedCountEl = $('#removedCount');
const spamCountTop = $('#spamCountTop');
const statusLine = $('#statusLine');

let currentCode = '';
let rowsCache = [];
let pollTimer = null;
let isLoadingEvents = false;
let isFetchingRows = false;
let latestFetchIssued = 0;
let latestFetchApplied = 0;
let isActionInFlight = false;
let artCache = new Map();
let vipNamesCache = [];
let hasEverLoadedRows = false;

function safeString(v){
  return String(v || '').trim();
}

function escapeHTML(s){
  return String(s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

function keySong(song, artist){
  return `${safeString(song).toLowerCase()}|${safeString(artist).toLowerCase()}`;
}

function parseEventDate(dateStr){
  const s = safeString(dateStr);
  if (!s) return new Date(NaN);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  return new Date(s);
}

function pad2(n){
  return String(n).padStart(2, '0');
}

function dow3(n){
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n] || '';
}

function formatHeaderDate(s){
  const d = parseEventDate(s);
  if (isNaN(d)) return '';
  return `${dow3(d.getDay())} ${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}.${String(d.getFullYear()).slice(-2)}`;
}

function normalizePlayedStatus(row){
  const s = safeString(row?.played_status).toLowerCase();
  if (s === 'played') return 'played';
  if (s === 'removed') return 'removed';
  return 'not played';
}

function normalizeSpamStatus(row){
  const s = safeString(row?.spam_status).toLowerCase();
  return s || 'clean';
}

function isRowVip(row){
  return !!row?.is_vip;
}

function showFullLoading(msg = 'Loading your requests...'){
  inlineText.textContent = msg;
  inlineText.classList.remove('bad', 'warn');
  inlineText.classList.add('good');
  inlineProgress.classList.add('show');
  inlineSpin.classList.remove('show');
}

function showSpinnerOnly(msg = ''){
  inlineText.textContent = msg;
  inlineText.classList.remove('good', 'bad', 'warn');
  if (msg) inlineText.classList.add('warn');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.add('show');
}

function clearInline(){
  inlineText.textContent = '';
  inlineText.classList.remove('good', 'bad', 'warn');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.remove('show');
}

function showEventsError(){
  inlineText.textContent = 'Could not load events.';
  inlineText.classList.remove('good', 'warn');
  inlineText.classList.add('bad');
  inlineProgress.classList.remove('show');
  inlineSpin.classList.remove('show');
}

function setStatusMessage(msg, isError = false){
  statusLine.textContent = msg || '';
  statusLine.style.color = isError ? '#ef4444' : '#ffffff';
}

function setVipMeta(vipNames){
  const count = Array.isArray(vipNames) ? vipNames.length : 0;
  vipMeta.textContent = currentCode ? `VIPs for this event: ${count}` : '';
}

function jsonp(url, params = {}){
  const qs = new URLSearchParams(params);
  const cb = 'cb_' + Math.random().toString(36).slice(2);
  qs.set('callback', cb);
  qs.set('t', Date.now() + '_' + Math.random().toString(36).slice(2));

  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('timeout'));
    }, JSONP_TIMEOUT_MS);

    function cleanup(){
      clearTimeout(timeout);
      try{ delete window[cb]; }catch{}
      s.remove();
    }

    window[cb] = (payload) => {
      cleanup();
      resolve(payload);
    };

    s.onerror = () => {
      cleanup();
      reject(new Error('jsonp'));
    };

    s.src = url + (url.includes('?') ? '&' : '?') + qs.toString();
    document.body.appendChild(s);
  });
}

function spotifyIdFromUrl(url){
  const s = safeString(url);
  if (!s) return null;

  let m = s.match(/^spotify:(track|artist|album):([A-Za-z0-9]+)$/i);
  if (m) return { type: m[1].toLowerCase(), id: m[2] };

  m = s.match(/open\.spotify\.com\/(track|artist|album)\/([A-Za-z0-9]+)/i);
  if (m) return { type: m[1].toLowerCase(), id: m[2] };

  return null;
}

function spotifyUriFromLinkOrSearch({ link, song, artist, kind }){
  const parsed = spotifyIdFromUrl(link);

  if (parsed && parsed.type === kind){
    return `spotify:${kind}:${parsed.id}`;
  }

  if (kind === 'track' && parsed && parsed.type === 'track'){
    return `spotify:track:${parsed.id}`;
  }

  const sSong = safeString(song);
  const sArtist = safeString(artist);

  if (kind === 'artist'){
    const q = sArtist ? `artist:${sArtist}` : `artist:${sSong}`;
    return `spotify:search:${encodeURIComponent(q)}`;
  }

  if (kind === 'album'){
    const q = sArtist ? `${sSong} ${sArtist}` : sSong;
    return `spotify:search:${encodeURIComponent(q)}`;
  }

  if (sSong && sArtist){
    return `spotify:search:${encodeURIComponent(`track:${sSong} artist:${sArtist}`)}`;
  }

  return `spotify:search:${encodeURIComponent(sSong || sArtist || '')}`;
}

function openSpotifyUri(uri){
  try{
    window.location.href = uri;
  }catch{}
}

async function getArtwork(song, artist){
  const k = keySong(song, artist);
  if (artCache.has(k)) return artCache.get(k);

  try{
    const data = await jsonp('https://itunes.apple.com/search', {
      term: `${safeString(song)} ${safeString(artist)}`.trim(),
      entity: 'musicTrack',
      limit: 1
    });

    const url = data?.results?.[0]?.artworkUrl100 || data?.results?.[0]?.artworkUrl60 || '';
    artCache.set(k, url || '');
    return url || '';
  }catch{
    artCache.set(k, '');
    return '';
  }
}

async function loadActiveEvents(){
  if (isLoadingEvents) return;
  isLoadingEvents = true;
  showFullLoading('Loading your events...');

  try{
    const r = await jsonp(ENDPOINT_URL, { mode: 'listActive' });
    const list = Array.isArray(r?.events) ? r.events.slice() : [];
    list.sort((a, b) => parseEventDate(a.date || 0) - parseEventDate(b.date || 0));

    eventSel.innerHTML = '';

    if (!list.length){
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'No active events';
      eventSel.appendChild(opt);
      currentCode = '';
      vipNamesCache = [];
      setVipMeta([]);
      showEventsError();
      return;
    }

    for (const ev of list){
      const opt = document.createElement('option');
      opt.value = ev.code;
      const d = formatHeaderDate(ev.date);
      opt.textContent = d ? `${d} - ${ev.name}` : (ev.name || ev.code);
      eventSel.appendChild(opt);
    }

    const pre = safeString(new URLSearchParams(location.search).get('event'));
    if (pre && [...eventSel.options].some(o => o.value === pre)){
      eventSel.value = pre;
    }

    currentCode = eventSel.value || '';
    clearInline();
  }catch{
    showEventsError();
  }finally{
    isLoadingEvents = false;
  }
}

function stopPolling(){
  if (pollTimer){
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(() => {
    fetchRows({ background: true });
  }, POLL_MS);
}

async function fetchRows({ background = false } = {}){
  if (!currentCode) return false;
  if (isFetchingRows) return false;

  isFetchingRows = true;
  const fetchId = ++latestFetchIssued;

  if (background){
    showSpinnerOnly('Refreshing...');
  }else{
    showFullLoading('Loading your requests...');
  }

  try{
    const r = await jsonp(ENDPOINT_URL, { mode: 'read', event: currentCode });

    if (fetchId < latestFetchApplied){
      return false;
    }

    latestFetchApplied = fetchId;

    if (!r || r.ok === false){
      throw new Error(r?.error || 'read failed');
    }

    const rawRows = Array.isArray(r.rows) ? r.rows : [];
    const vipNames = Array.isArray(r.vip_names) ? r.vip_names : [];

    rowsCache = rawRows.map(x => ({ ...x }));
    vipNamesCache = vipNames.slice();
    hasEverLoadedRows = true;

    renderAll(rowsCache);
    setVipMeta(vipNamesCache);
    setStatusMessage('');
    clearInline();
    return true;
  }catch{
    if (hasEverLoadedRows){
      inlineText.textContent = 'Reconnecting...';
      inlineText.classList.remove('good', 'bad');
      inlineText.classList.add('warn');
      inlineProgress.classList.remove('show');
      inlineSpin.classList.add('show');
      setStatusMessage('Connection issue. Keeping last loaded requests on screen.', true);
    }else{
      inlineText.textContent = 'Still trying to load requests...';
      inlineText.classList.remove('good');
      inlineText.classList.remove('warn');
      inlineText.classList.add('bad');
      inlineProgress.classList.remove('show');
      inlineSpin.classList.add('show');
      setStatusMessage('Connection error.', true);
    }
    return false;
  }finally{
    isFetchingRows = false;
  }
}

function makeGroupedPersonMap(){
  return new Map();
}

function addPersonToMap(map, row){
  const name = safeString(row.name) || 'Guest';
  const key = name.toLowerCase();
  const existing = map.get(key);

  if (existing){
    existing.count += 1;
    if (isRowVip(row)) existing.isVip = true;
    return;
  }

  map.set(key, {
    name,
    count: 1,
    isVip: isRowVip(row)
  });
}

function splitBuckets(rows){
  const requestMap = new Map();
  const playedMap = new Map();
  const removedMap = new Map();
  const spamMap = new Map();

  for (const row of rows){
    const song = safeString(row.song_title || row.song);
    const artist = safeString(row.artist);
    const link = safeString(row.link);
    const k = keySong(song, artist);
    const playedStatus = normalizePlayedStatus(row);
    const spamStatus = normalizeSpamStatus(row);

    if (!song && !artist) continue;

    if (spamStatus !== 'clean'){
      const spamKey = `${k}|${safeString(row.name).toLowerCase()}|${spamStatus}`;
      let sg = spamMap.get(spamKey);
      if (!sg){
        sg = {
          key: spamKey,
          song,
          artist,
          name: safeString(row.name) || 'Guest',
          count: 0,
          spam_status: spamStatus,
          link,
          is_vip: isRowVip(row)
        };
        spamMap.set(spamKey, sg);
      }
      sg.count += 1;
      continue;
    }

    if (playedStatus === 'played'){
      let g = playedMap.get(k);
      if (!g){
        g = {
          key: k,
          song,
          artist,
          ids: [],
          link: '',
          peopleMap: makeGroupedPersonMap(),
          hasVip: false
        };
        playedMap.set(k, g);
      }
      g.ids.push(row.id);
      addPersonToMap(g.peopleMap, row);
      if (!g.link && link) g.link = link;
      if (isRowVip(row)) g.hasVip = true;
      continue;
    }

    if (playedStatus === 'removed'){
      let g = removedMap.get(k);
      if (!g){
        g = {
          key: k,
          song,
          artist,
          ids: [],
          link: '',
          peopleMap: makeGroupedPersonMap(),
          hasVip: false
        };
        removedMap.set(k, g);
      }
      g.ids.push(row.id);
      addPersonToMap(g.peopleMap, row);
      if (!g.link && link) g.link = link;
      if (isRowVip(row)) g.hasVip = true;
      continue;
    }

    let g = requestMap.get(k);
    if (!g){
      g = {
        key: k,
        song,
        artist,
        ids: [],
        link: '',
        peopleMap: makeGroupedPersonMap(),
        hasVip: false
      };
      requestMap.set(k, g);
    }
    g.ids.push(row.id);
    addPersonToMap(g.peopleMap, row);
    if (!g.link && link) g.link = link;
    if (isRowVip(row)) g.hasVip = true;
  }

  function finalizeGroup(g){
    const people = [...g.peopleMap.values()].sort((a, b) => {
      if (a.isVip !== b.isVip) return a.isVip ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    return {
      key: g.key,
      song: g.song,
      artist: g.artist,
      ids: g.ids.slice(),
      link: g.link,
      people,
      guestCount: people.length,
      hasVip: g.hasVip
    };
  }

  return {
    requests: [...requestMap.values()].map(finalizeGroup),
    played: [...playedMap.values()].map(finalizeGroup),
    removed: [...removedMap.values()].map(finalizeGroup),
    spam: [...spamMap.values()].sort((a, b) => b.count - a.count || a.song.localeCompare(b.song))
  };
}

function namesBoxHTML(people){
  const items = people.map(p => {
    const star = p.isVip ? `<span class="vip-star">★</span>` : '';
    return `<li>${escapeHTML(p.name)}${star}</li>`;
  }).join('');

  return `
    <div class="names-box">
      <p class="hdr">Requesters</p>
      <ul>${items}</ul>
    </div>
  `;
}

function buildCardBase(obj){
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.key = obj.key;
  el.dataset.ids = JSON.stringify(obj.ids);
  el.dataset.song = obj.song || '';
  el.dataset.artist = obj.artist || '';
  el.dataset.link = obj.link || '';

  const vipChip = obj.hasVip ? `<div class="vip-chip">VIP REQUEST</div>` : '';

  el.innerHTML = `
    <img class="thumb" alt="">
    <div class="meta">
      <p class="title" title="Open in Spotify">${escapeHTML(obj.song || 'Unknown Title')}</p>
      <p class="sub" title="Open artist in Spotify">${escapeHTML(obj.artist || 'Unknown Artist')}</p>
      <div class="reqline"><span class="car">▸</span><span class="txt">Requested by ${obj.guestCount} guest${obj.guestCount === 1 ? '' : 's'}</span></div>
      ${vipChip}
      ${namesBoxHTML(obj.people)}
    </div>
    <div class="actions"></div>
  `;

  getArtwork(obj.song, obj.artist).then(src => {
    const img = el.querySelector('.thumb');
    if (img && src){
      img.src = src;
      img.alt = `${obj.song} cover`;
    }
  });

  bindCardCommon(el);
  return el;
}

function bindCardCommon(el){
  const box = el.querySelector('.names-box');
  const reqline = el.querySelector('.reqline');
  const car = reqline.querySelector('.car');

  reqline.onclick = () => {
    const open = box.classList.toggle('open');
    car.textContent = open ? '▾' : '▸';
  };

  const titleEl = el.querySelector('.title');
  const artistEl = el.querySelector('.sub');
  const thumbEl = el.querySelector('.thumb');

  titleEl.onclick = () => {
    openSpotifyUri(spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'track'
    }));
  };

  artistEl.onclick = () => {
    openSpotifyUri(spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'artist'
    }));
  };

  thumbEl.onclick = () => {
    openSpotifyUri(spotifyUriFromLinkOrSearch({
      link: el.dataset.link,
      song: el.dataset.song,
      artist: el.dataset.artist,
      kind: 'album'
    }));
  };
}

function updateCardBase(node, obj){
  node.dataset.ids = JSON.stringify(obj.ids);
  node.dataset.song = obj.song || '';
  node.dataset.artist = obj.artist || '';
  node.dataset.link = obj.link || '';

  node.querySelector('.title').textContent = obj.song || 'Unknown Title';
  node.querySelector('.sub').textContent = obj.artist || 'Unknown Artist';
  node.querySelector('.txt').textContent = `Requested by ${obj.guestCount} guest${obj.guestCount === 1 ? '' : 's'}`;

  const existingChip = node.querySelector('.vip-chip');
  if (obj.hasVip && !existingChip){
    const chip = document.createElement('div');
    chip.className = 'vip-chip';
    chip.textContent = 'VIP REQUEST';
    node.querySelector('.reqline').insertAdjacentElement('afterend', chip);
  }
  if (!obj.hasVip && existingChip){
    existingChip.remove();
  }

  const currentlyOpen = node.querySelector('.names-box')?.classList.contains('open');
  node.querySelector('.names-box').outerHTML = namesBoxHTML(obj.people);
  bindCardCommon(node);

  if (currentlyOpen){
    const box = node.querySelector('.names-box');
    const car = node.querySelector('.reqline .car');
    box.classList.add('open');
    car.textContent = '▾';
  }
}

function renderList(container, items, makeNode, updateNode){
  const existing = new Map();
  Array.from(container.children).forEach(ch => {
    if (ch.dataset?.key) existing.set(ch.dataset.key, ch);
  });

  existing.forEach((node, key) => {
    if (!items.some(it => it.key === key)){
      node.remove();
    }
  });

  if (!items.length){
    container.innerHTML = `<div class="empty-state">No songs in this section.</div>`;
    return;
  }

  if (container.children.length === 1 && container.querySelector('.empty-state')){
    container.innerHTML = '';
  }

  let cursor = container.firstChild;

  for (const it of items){
    let node = existing.get(it.key);
    if (!node){
      node = makeNode(it);
      container.insertBefore(node, cursor || null);
    }else{
      updateNode(node, it);
      if (node !== cursor){
        container.insertBefore(node, cursor || null);
      }
    }
    cursor = node.nextSibling;
  }
}

function buildSpamCard(obj){
  const el = document.createElement('div');
  el.className = 'card';

  const vipText = obj.is_vip ? `<span class="vip-star">★</span>` : '';
  const statusText = obj.spam_status === 'spam' ? 'Spam' : 'Possible Spam';

  el.innerHTML = `
    <img class="thumb" alt="">
    <div class="meta">
      <p class="title">${escapeHTML(obj.song || 'Unknown Title')}</p>
      <p class="sub">${escapeHTML(obj.artist || 'Unknown Artist')}</p>
      <p class="sub">Requested by ${escapeHTML(obj.name || 'Guest')}${vipText} (x${obj.count})</p>
      <div class="vip-chip" style="margin-top:8px;">${escapeHTML(statusText)}</div>
    </div>
    <div class="actions"></div>
  `;

  getArtwork(obj.song, obj.artist).then(src => {
    const img = el.querySelector('.thumb');
    if (img && src){
      img.src = src;
      img.alt = `${obj.song} cover`;
    }
  });

  return el;
}

function renderSpamList(items){
  spamList.innerHTML = '';
  if (!items.length){
    spamList.innerHTML = `<div class="empty-state">No spammed requests.</div>`;
    return;
  }

  for (const item of items){
    spamList.appendChild(buildSpamCard(item));
  }
}

function renderAll(rows){
  const { requests, played, removed, spam } = splitBuckets(rows);

  const sortedReq = [...requests].sort((a, b) =>
    b.guestCount - a.guestCount ||
    (b.hasVip ? 1 : 0) - (a.hasVip ? 1 : 0) ||
    (a.song || '').localeCompare(b.song || '')
  );

  const sortedPlayed = [...played].sort((a, b) =>
    (a.song || '').localeCompare(b.song || '')
  );

  const sortedRemoved = [...removed].sort((a, b) =>
    (a.song || '').localeCompare(b.song || '')
  );

  renderList(reqList, sortedReq,
    (obj) => {
      const el = buildCardBase(obj);
      attachRequestActions(el);
      return el;
    },
    (node, obj) => {
      updateCardBase(node, obj);
      attachRequestActions(node);
    }
  );

  renderList(playedList, sortedPlayed,
    (obj) => {
      const el = buildCardBase(obj);
      attachPlayedActions(el);
      return el;
    },
    (node, obj) => {
      updateCardBase(node, obj);
      attachPlayedActions(node);
    }
  );

  renderList(removedList, sortedRemoved,
    (obj) => {
      const el = buildCardBase(obj);
      attachRemovedActions(el);
      return el;
    },
    (node, obj) => {
      updateCardBase(node, obj);
      attachRemovedActions(node);
    }
  );

  renderSpamList(spam);

  reqCountEl.textContent = `(${sortedReq.length})`;
  playedCountEl.textContent = `(${sortedPlayed.length})`;
  removedCountEl.textContent = `(${sortedRemoved.length})`;
  spamCountTop.textContent = `(${spam.length})`;
}

async function setPlayedOne(id, status){
  const r = await jsonp(ENDPOINT_URL, {
    mode: 'setPlayed',
    id,
    status
  });

  if (!r || r.ok === false){
    throw new Error(r?.error || 'setPlayed failed');
  }

  return r;
}

function rowIdsNowInBucket(ids, targetStatus){
  const target = safeString(targetStatus).toLowerCase();
  const idSet = new Set(ids.map(String));

  const matches = rowsCache.filter(row => idSet.has(String(row.id)));
  if (!matches.length) return false;

  return matches.every(row => normalizePlayedStatus(row) === target);
}

async function verifyActionApplied(ids, expectedStatus){
  for (let i = 0; i < ACTION_VERIFY_ATTEMPTS; i++){
    const ok = await fetchRows({ background: true });
    if (ok && rowIdsNowInBucket(ids, expectedStatus)){
      return true;
    }
    await sleep(ACTION_VERIFY_DELAY_MS);
  }
  return false;
}

async function setStatusForIds(ids, status){
  if (!Array.isArray(ids) || !ids.length) return;
  if (isActionInFlight) return;

  isActionInFlight = true;
  showSpinnerOnly('Updating...');
  setStatusMessage('');

  try{
    for (const id of ids){
      await setPlayedOne(id, status);
      await sleep(150);
    }

    const verified = await verifyActionApplied(ids, status);

    if (!verified){
      setStatusMessage('Update sent, but the backend has not reflected the change yet. It may appear shortly.', true);
    }else{
      setStatusMessage('');
    }
  }catch(err){
    setStatusMessage('Could not update request status.', true);
  }finally{
    isActionInFlight = false;
    clearInline();
  }
}

function attachRequestActions(card){
  const actions = card.querySelector('.actions');
  actions.innerHTML = `
    <button class="btn played" type="button">Mark as Played</button>
    <button class="btn remove" type="button">Remove</button>
  `;

  actions.querySelector('.btn.played').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'played');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = false);
  };

  actions.querySelector('.btn.remove').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'removed');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = false);
  };
}

function attachPlayedActions(card){
  const actions = card.querySelector('.actions');
  actions.innerHTML = `
    <button class="btn unplayed" type="button">Mark as Unplayed</button>
  `;

  actions.querySelector('.btn.unplayed').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'not played');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = false);
  };
}

function attachRemovedActions(card){
  const actions = card.querySelector('.actions');
  actions.innerHTML = `
    <button class="btn putback" type="button">Put Back</button>
  `;

  actions.querySelector('.btn.putback').onclick = async () => {
    const ids = JSON.parse(card.dataset.ids || '[]');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = true);
    await setStatusForIds(ids, 'not played');
    actions.querySelectorAll('.btn').forEach(b => b.disabled = false);
  };
}

function initCollapsibles(){
  document.querySelectorAll('.collapsible-header').forEach(h => {
    h.addEventListener('click', () => {
      const p = h.parentElement;
      p.classList.toggle('open');
      const t = h.querySelector('.twist');
      if (t){
        t.textContent = p.classList.contains('open') ? '▾' : '▸';
      }
    });
  });
}

function setTab(which){
  if (which === 'spam'){
    tabSpamBtn.classList.add('active');
    tabRequestsBtn.classList.remove('active');
    tabSpamPane.classList.remove('hidden');
    tabRequestsPane.classList.add('hidden');
    return;
  }

  tabRequestsBtn.classList.add('active');
  tabSpamBtn.classList.remove('active');
  tabRequestsPane.classList.remove('hidden');
  tabSpamPane.classList.add('hidden');
}

tabRequestsBtn.addEventListener('click', () => setTab('requests'));
tabSpamBtn.addEventListener('click', () => setTab('spam'));

eventSel.addEventListener('change', async () => {
  currentCode = eventSel.value || '';
  rowsCache = [];
  vipNamesCache = [];
  setVipMeta([]);
  latestFetchIssued = 0;
  latestFetchApplied = 0;
  hasEverLoadedRows = false;
  await fetchRows({ background: false });
  startPolling();
});

(async function boot(){
  initCollapsibles();
  setTab('requests');
  await loadActiveEvents();

  if (eventSel.value){
    currentCode = eventSel.value || '';
    await fetchRows({ background: false });
    startPolling();
  }
})();
</script>
