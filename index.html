<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Song Request • David Charles Events</title>
<style>
  :root{
    --bg:#212121; --surface:#303030; --surface-2:#343434; --surface-2-hover:#3d3d3d;
    --ink:#f2f2f2; --muted:#bdbdbd; --border:#3a3a3a;
    --accent:#1dcec9; --focus:#e6e6e6; --ring:rgba(255,255,255,.22);
    --radius:12px; --field-max:640px;
  }
  @font-face{
    font-family:"Adventor";
    src:url("texgyreadventor-regular.otf") format("opentype");
    font-weight:400; font-style:normal; font-display:swap;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap{ width:100%; max-width:960px; margin:0 auto; padding:16px 12px 48px; }
  .dce-logo{text-align:center; margin:14px 0 6px;}
  .dce-logo img{ max-width:min(220px,60vw); height:auto; }
  .app-title{
    text-align:center; margin:0 auto 26px; font-weight:800; letter-spacing:.06em; line-height:1.05;
    font-size:clamp(22px,6vw,38px); color:#fff;
  }

  .event-closed{
    width:100%;
    max-width:var(--field-max);
    margin:0 auto 18px;
    padding:14px 16px;
    border:1px solid rgba(255,128,128,.28);
    border-radius:14px;
    background:rgba(198,40,40,.14);
    color:#ffd4d4;
    text-align:center;
    font-size:14px;
    line-height:1.45;
    display:none;
  }
  .event-closed.show{ display:block; }

  .row{ width:100%; max-width:var(--field-max); margin:0 auto; }
  label{ display:block; font-size:14px; color:var(--muted); margin:10px 0 6px; }
  input[type="text"]{
    width:100%; height:52px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); color:var(--ink); font-size:16px; outline:none;
    transition: box-shadow .12s ease, border-color .12s ease, opacity .12s ease;
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  input[type="text"]::placeholder{ color:#9e9e9e; }
  input[type="text"]:focus{ border-color:var(--focus); box-shadow:0 0 0 3px var(--ring); }
  input[type="text"]:disabled{
    opacity:.6;
    cursor:not-allowed;
  }

  .field{ position:relative; }
  .search{
    width:100%; height:52px; padding:0 42px 0 14px; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--surface); color:var(--ink); font-size:16px;
    transition: box-shadow .12s ease, border-color .12s ease, opacity .12s ease;
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  .search::placeholder{ color:#9e9e9e; }
  .search:focus{ border-color:var(--focus); box-shadow:0 0 0 3px var(--ring); }
  .search:disabled{
    opacity:.6;
    cursor:not-allowed;
  }

  .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%;
    display:none; align-items:center; justify-content:center; border:1px solid var(--border); background:#2b2b2b; color:#e0e0e0;
    cursor:pointer; user-select:none; line-height:1; font-size:18px;
  }
  .clear.show{ display:flex; }
  .clear:active{ transform:translateY(-50%) scale(0.98); }
  .clear:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .results{ margin-top:6px; }
  .hidden{ display:none !important; }
  .item{
    display:grid; grid-template-columns:56px 1fr; align-items:center; gap:12px; padding:10px;
    border:1px solid var(--border); border-radius:12px; background:var(--surface-2);
    transition:background .15s,transform .06s,border-color .15s; cursor:pointer; margin-bottom:8px;
  }
  .item:hover{ background:var(--surface-2-hover); }
  .item:active{ transform:scale(.995); }
  .cover{
    width:56px; height:56px; border-radius:10px; object-fit:cover; background:#1f1f1f; color:#9aa6b2;
    display:grid; place-items:center; font-size:12px;
  }
  .info{ min-width:0; }
  .ttl{
    margin:0 0 2px; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff;
  }
  .art{
    margin:0; color:#cfcfcf; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .selected{ margin-top:6px; border:1px solid var(--border); border-radius:12px; background:var(--surface); display:none; }
  .selected.active{ border-color:var(--focus); box-shadow:0 0 0 3px var(--ring); }
  .sel-inner{ display:grid; grid-template-columns:72px 1fr; gap:12px; align-items:center; padding:10px; }
  .sel-cover{
    width:72px; height:72px; border-radius:12px; object-fit:cover; background:#1f1f1f; color:#9aa6b2;
    display:grid; place-items:center; font-size:14px;
  }
  .sel-text{ min-width:0; }
  .sel-title{
    margin:0 0 2px; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff;
  }
  .sel-artist{
    margin:0; color:#cfcfcf; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .status{ margin-top:6px; font-size:13px; color:var(--muted); min-height:0; }

  .actions{ width:100%; max-width:var(--field-max); margin:20px auto 0; }
  .btn{
    width:100%; height:54px; border:1px solid var(--accent); background:var(--accent); color:#000000;
    border-radius:14px; cursor:pointer; font-weight:800; letter-spacing:.03em; font-size:16px; text-transform:uppercase;
    display:inline-flex; align-items:center; justify-content:center; transform:translateZ(0);
    transition:transform .06s, filter .15s, opacity .15s, background .15s;
    box-shadow:0 2px 0 rgba(0,0,0,.35), 0 10px 18px rgba(0,0,0,.15);
    font-family:"Adventor", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn:active{ transform:scale(0.985); }
  .btn[disabled]{ opacity:.75; cursor:not-allowed; }
  .btn .spin{
    width:18px; height:18px; margin-right:10px; border-radius:50%;
    border:2px solid rgba(6,44,42,.4); border-top-color:#062c2a;
    animation:spin .8s linear infinite; display:none;
  }
  .btn.loading .spin{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .ty-overlay{
    position:fixed; inset:0; background:rgba(33,33,33,.98); display:none; align-items:center; justify-content:center;
    z-index:9999; backdrop-filter:blur(2px);
  }
  .ty-wrap{ text-align:center; padding:24px; max-width:92vw; color:#ffffff; }
  .ty-icon{
    width:96px; height:96px; margin:0 auto 22px; display:grid; place-items:center; border-radius:50%;
    background:#1dcec9; box-shadow:0 6px 18px rgba(29,206,201,.35); color:#052911; font-size:52px;
  }
  .ty-title{
    font-weight:800; font-size:clamp(28px,7.8vw,56px); line-height:1.05; margin:0 0 8px; color:#ffffff;
  }
  .ty-sub{
    font:500 16px/1.5 "Adventor",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:#ffffff; margin:0;
  }

  .ty-overlay[data-state="success"] .ty-icon{
    background:#1dcec9;
    box-shadow:0 6px 18px rgba(29,206,201,.35);
    color:#052911;
  }

  .ty-overlay[data-state="denied"] .ty-icon{
    background:#c62828;
    box-shadow:0 0 18px rgba(255,82,82,.55), 0 6px 18px rgba(198,40,40,.35);
    color:#ffffff;
  }

  .ty-action-btn{
    min-width:220px;
    height:48px;
    border:none;
    border-radius:12px;
    background:#1dcec9;
    color:#000;
    font:800 15px/1 "Adventor",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.35), 0 10px 18px rgba(0,0,0,.15);
  }

  @media (max-width:480px){
    .wrap{ padding-left:10px; padding-right:10px; }
    .sel-inner{ grid-template-columns:64px 1fr; }
    .sel-cover{ width:64px; height:64px; }
  }

  .dbg{
    display:none; width:100%; max-width:var(--field-max); margin:10px auto 0; color:#a7f3d0;
    background:rgba(45,212,191,.12); border:1px solid rgba(45,212,191,.35); border-radius:16px;
    padding:8px 12px; font-size:12px; line-height:1.45; white-space:pre-wrap;
  }
  .dbg.show{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="dce-logo">
    <img src="assets/dce-logo.png" alt="David Charles Events" onerror="this.style.display='none'">
  </div>

  <div class="app-title">SONG REQUEST</div>
  <div id="debugPill" class="dbg"></div>

  <div id="eventClosedNotice" class="event-closed" aria-live="polite" aria-atomic="true">
    Requests are currently closed for this event.
  </div>

  <div class="row" id="nameRow">
    <label for="yourName">What's your name?</label>
    <input type="text" id="yourName" autocomplete="name" placeholder="Your name" />
  </div>

  <div class="row" id="searchRow" style="margin-top:20px;">
    <label for="q">Search Song, Artist or Lyrics</label>
    <div class="field">
      <input id="q" class="search" type="text" placeholder="Start typing…" autocomplete="off" inputmode="search" />
      <button id="clearBtn" class="clear" type="button" aria-label="Clear search">×</button>
    </div>

    <div id="results" class="results"></div>

    <div id="selected" class="selected" aria-live="polite" aria-atomic="true">
      <div class="sel-inner">
        <div id="selCover" class="sel-cover" aria-hidden="true">♪</div>
        <div class="sel-text">
          <p id="selTitle" class="sel-title"></p>
          <p id="selArtist" class="sel-artist"></p>
        </div>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <input type="hidden" id="songTitle" />
  <input type="hidden" id="artist" />
  <input type="hidden" id="link" />

  <div class="actions" id="actionsRow">
    <button id="submitBtn" class="btn">
      <span class="spin" aria-hidden="true"></span>
      <span class="btntxt">SUBMIT</span>
    </button>
  </div>
</div>

<div class="ty-overlay" id="tyOverlay" role="dialog" aria-live="polite" aria-modal="true" data-state="success">
  <div class="ty-wrap">
    <div id="tyIcon" class="ty-icon">✓</div>
    <h1 id="tyTitle" class="ty-title">Got it!</h1>
    <p id="tySub" class="ty-sub">If it fits the flow, we’ll get it on. Let’s party.</p>
    <div id="tyActions" style="margin-top:18px; display:none;">
      <button id="tyActionBtn" type="button" class="ty-action-btn">Try a different song</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://anaofamvuusuemccfnkp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_oNLSe8ozVcT3hp65fJNcDg_0058Np2C';
const REDIRECT_DELAY_MS = 2200;
const CLIENT_TOKEN_KEY = 'dce_client_token';
const EVENT_STORAGE_KEY = 'dce_event';

const CLOSED_MESSAGE = 'Requests are currently closed for this event.';

const urlp = new URLSearchParams(location.search);
const DEBUG = urlp.get('debug') === '1';

function saveEventCode(code){ try{ localStorage.setItem(EVENT_STORAGE_KEY, code); }catch{} }
function loadEventCode(){ try{ return localStorage.getItem(EVENT_STORAGE_KEY) || ''; }catch{ return ''; } }

function randomToken(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'tok_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function getClientToken(){
  try{
    let token = localStorage.getItem(CLIENT_TOKEN_KEY);
    if (!token) {
      token = randomToken();
      localStorage.setItem(CLIENT_TOKEN_KEY, token);
    }
    return token;
  }catch{
    return randomToken();
  }
}

function normalizeTextForSongKey(s){
  return String(s || '')
    .trim()
    .toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/\(.*?\)/g, ' ')
    .replace(/\[.*?\]/g, ' ')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function buildNormalizedSongKey(title, artist){
  const t = normalizeTextForSongKey(title);
  const a = normalizeTextForSongKey(artist);
  if (t && a) return `${t}|${a}`;
  if (t) return t;
  if (a) return a;
  return '';
}

async function rpc(functionName, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_PUBLISHABLE_KEY,
      'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
    },
    body: JSON.stringify(body || {})
  });

  const text = await res.text();
  if (!res.ok){
    throw new Error(text || `HTTP ${res.status}`);
  }

  try{
    return JSON.parse(text);
  }catch{
    return [];
  }
}

async function fetchEventStatusViaRpc(eventCode){
  const data = await rpc('api_read_event_status', {
    p_event_code: eventCode
  });

  if (!Array.isArray(data) || !data.length) {
    return null;
  }

  return data[0];
}

async function fetchEventStatusDirect(eventCode){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/events?select=event_code,active&event_code=eq.${encodeURIComponent(eventCode)}&limit=1`,
    {
      method: 'GET',
      headers: {
        'apikey': SUPABASE_PUBLISHABLE_KEY,
        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        'Accept': 'application/json'
      }
    }
  );

  const text = await res.text();

  if (!res.ok){
    throw new Error(text || `HTTP ${res.status}`);
  }

  let rows = [];
  try{
    rows = JSON.parse(text);
  }catch{
    rows = [];
  }

  if (!Array.isArray(rows) || !rows.length) {
    return null;
  }

  return rows[0];
}

async function fetchEventStatus(eventCode){
  if (!eventCode) return null;

  let rpcError = null;
  let directError = null;

  try{
    const rpcRow = await fetchEventStatusViaRpc(eventCode);
    if (rpcRow) {
      if (DEBUG) {
        showDebug(`Event: ${eventCode}
Source: RPC
Active: ${rpcRow.active === true ? 'yes' : 'no'}`);
      }
      return rpcRow;
    }

    if (DEBUG) {
      showDebug(`Event: ${eventCode}
Source: RPC
Result: no rows returned
Trying direct lookup...`);
    }
  }catch(err){
    rpcError = err instanceof Error ? err.message : String(err);
    if (DEBUG) {
      showDebug(`Event: ${eventCode}
Source: RPC
Error: ${rpcError}
Trying direct lookup...`);
    }
  }

  try{
    const directRow = await fetchEventStatusDirect(eventCode);
    if (directRow) {
      if (DEBUG) {
        showDebug(`Event: ${eventCode}
Source: Direct table lookup
Active: ${directRow.active === true ? 'yes' : 'no'}`);
      }
      return directRow;
    }

    if (DEBUG) {
      showDebug(`Event: ${eventCode}
RPC error: ${rpcError || 'none'}
Direct lookup: no rows returned`);
    }
  }catch(err){
    directError = err instanceof Error ? err.message : String(err);
    if (DEBUG) {
      showDebug(`Event: ${eventCode}
RPC error: ${rpcError || 'none'}
Direct lookup error: ${directError}`);
    }
  }

  return null;
}

const CLIENT_TOKEN = getClientToken();
const SESSION_TOKEN = randomToken();

let EVENT_CODE = (urlp.get('event') || '').trim();
if (!EVENT_CODE && document.referrer) {
  try{
    const ref = new URL(document.referrer);
    const refEvent = ref.searchParams.get('event');
    if(refEvent) EVENT_CODE = refEvent.trim();
  }catch{}
}
if (!EVENT_CODE) { EVENT_CODE = loadEventCode(); }
if (EVENT_CODE) { saveEventCode(EVENT_CODE); }

const $ = s => document.querySelector(s);
const nameInput = $('#yourName'),
      q = $('#q'),
      clearBtn = $('#clearBtn'),
      resultsEl = $('#results'),
      selectedBox = $('#selected'),
      statusEl = $('#status'),
      submitBtn = $('#submitBtn'),
      selTitle = $('#selTitle'),
      selArtist = $('#selArtist'),
      eventClosedNotice = $('#eventClosedNotice'),
      nameRow = $('#nameRow'),
      searchRow = $('#searchRow'),
      actionsRow = $('#actionsRow');
let selCoverEl = $('#selCover');

const titleInput = $('#songTitle'),
      artistInput = $('#artist'),
      linkInput = $('#link');

const tyOverlay = $('#tyOverlay');
const tyIcon = $('#tyIcon');
const tyTitle = $('#tyTitle');
const tySub = $('#tySub');
const tyActions = $('#tyActions');
const tyActionBtn = $('#tyActionBtn');
const btnTxt = document.querySelector('.btntxt');

let EVENT_IS_ACTIVE = true;

function showDebug(msg){
  const pill = document.getElementById('debugPill');
  if (!DEBUG) return;
  pill.classList.add('show');
  pill.textContent = msg || (
    EVENT_CODE
      ? `Event: ${EVENT_CODE} | Client: ${CLIENT_TOKEN.slice(0,8)}...`
      : `No event detected | Client: ${CLIENT_TOKEN.slice(0,8)}...`
  );
}

if (DEBUG) showDebug();

function setStatus(m='', err=false){
  statusEl.textContent = m;
  statusEl.style.color = err ? '#ffb4b4' : 'var(--muted)';
}

function clearResults(){ resultsEl.innerHTML=''; }
function showResults(){ resultsEl.classList.remove('hidden'); }
function hideResults(){ resultsEl.classList.add('hidden'); clearResults(); }

function hideSelected(){
  selectedBox.style.display='none';
  selectedBox.classList.remove('active');
  if(selCoverEl && selCoverEl.tagName.toLowerCase()==='img'){
    selCoverEl.outerHTML=`<div id="selCover" class="sel-cover" aria-hidden="true">♪</div>`;
    selCoverEl=document.getElementById('selCover');
  }
  selTitle.textContent='';
  selArtist.textContent='';
}

function setSubmissionAvailability(isActive){
  EVENT_IS_ACTIVE = !!isActive;

  nameInput.disabled = !EVENT_IS_ACTIVE;
  q.disabled = !EVENT_IS_ACTIVE;
  clearBtn.disabled = !EVENT_IS_ACTIVE;
  submitBtn.disabled = !EVENT_IS_ACTIVE;

  if (EVENT_IS_ACTIVE){
    eventClosedNotice.classList.remove('show');

    if (nameRow) nameRow.style.display = '';
    if (searchRow) searchRow.style.display = '';
    if (actionsRow) actionsRow.style.display = '';

    if (!submitBtn.classList.contains('loading')){
      btnTxt.textContent = 'SUBMIT';
    }

    setStatus('');
  } else {
    eventClosedNotice.classList.add('show');

    if (nameRow) nameRow.style.display = 'none';
    if (searchRow) searchRow.style.display = 'none';
    if (actionsRow) actionsRow.style.display = 'none';

    hideResults();
    hideSelected();
    setStatus('');
    btnTxt.textContent = 'REQUESTS CLOSED';
  }

  if (DEBUG) {
    const existing = document.getElementById('debugPill')?.textContent || '';
    showDebug(`${existing}

Availability applied: ${EVENT_IS_ACTIVE ? 'open' : 'closed'}`);
  }
}

async function refreshEventAvailability(){
  eventClosedNotice.textContent = CLOSED_MESSAGE;

  if (!EVENT_CODE){
    if (DEBUG) {
      showDebug(`No event code found in URL, referrer, or localStorage.`);
    }
    setSubmissionAvailability(false);
    return false;
  }

  try{
    const eventRow = await fetchEventStatus(EVENT_CODE);
    if (!eventRow){
      if (DEBUG) {
        const existing = document.getElementById('debugPill')?.textContent || '';
        showDebug(`${existing}

No matching event row found for this code.`);
      }
      setSubmissionAvailability(false);
      return false;
    }

    const isActive = eventRow.active === true;
    setSubmissionAvailability(isActive);

    if (isActive){
      setStatus('');
    }

    return isActive;
  }catch(err){
    if (DEBUG) {
      showDebug(`Event: ${EVENT_CODE}
Availability check failed:
${err instanceof Error ? err.message : String(err)}`);
    }
    setSubmissionAvailability(false);
    return false;
  }
}

function jsonp(url, cbParam='callback'){
  return new Promise((res,rej)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    s.src = url + (url.includes('?') ? '&' : '?') + cbParam + '=' + cb + '&t=' + Date.now();
    const kill = setTimeout(()=>{ cleanup(); rej(new Error('timeout')); }, 9000);
    function cleanup(){ clearTimeout(kill); try{ delete window[cb]; }catch{} s.remove(); }
    window[cb] = (data)=>{ cleanup(); res(data); };
    s.onerror = ()=>{ cleanup(); rej(new Error('jsonp error')); };
    document.body.appendChild(s);
  });
}

async function searchITunes(term){
  try{
    const data = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=musicTrack&limit=8`, 'callback');
    return (data?.results||[]).map(t=>({
      title:t.trackName,
      artist:t.artistName,
      cover:t.artworkUrl100||t.artworkUrl60,
      link:t.trackViewUrl
    }));
  }catch(_e){
    try{
      const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=musicTrack&limit=8`, {
        mode:'cors',
        cache:'no-store'
      });
      if (r.ok) {
        const data = await r.json();
        return (data?.results||[]).map(t=>({
          title:t.trackName,
          artist:t.artistName,
          cover:t.artworkUrl100||t.artworkUrl60,
          link:t.trackViewUrl
        }));
      }
    }catch(__e){}
  }
  return [];
}

async function searchDeezer(term){
  try{
    const data = await jsonp(`https://api.deezer.com/search?q=${encodeURIComponent(term)}&limit=8&output=jsonp`, 'callback');
    return (data?.data||[]).map(d=>({
      title:d.title,
      artist:d?.artist?.name||'',
      cover:d?.album?.cover_medium||d?.album?.cover||'',
      link:d.link||''
    }));
  }catch(_e){
    return [];
  }
}

async function searchMB(term){
  try{
    const r = await fetch(`https://musicbrainz.org/ws/2/recording/?query=${encodeURIComponent(term)}&fmt=json&limit=8`, {
      headers:{'User-Agent':'DCE-SongRequest/1.0 (https://www.davidcharlesevents.com)'},
      cache:'no-store'
    });
    if(!r.ok) return [];
    const data = await r.json();
    return (data.recordings||[]).map(rec=>{
      const ac=rec['artist-credit'];
      const artist=ac && ac[0] && ac[0].name ? ac[0].name : '';
      return {
        title:rec.title,
        artist,
        cover:'',
        link:`https://musicbrainz.org/recording/${rec.id}`
      };
    });
  }catch(_e){
    return [];
  }
}

function render(list){
  clearResults();
  if(!list.length){
    setStatus('No results');
    return;
  }
  setStatus('');
  showResults();

  list.forEach(({title,artist,cover,link})=>{
    const div=document.createElement('div');
    div.className='item';
    div.setAttribute('role','button');
    div.setAttribute('tabindex','0');

    const coverHTML=cover
      ? `<img class="cover" src="${cover}" alt="Album cover" loading="lazy" decoding="async" width="56" height="56">`
      : `<div class="cover" aria-hidden="true">♪</div>`;

    div.innerHTML=`${coverHTML}<div class="info"><p class="ttl">${title||'Unknown Title'}</p><p class="art">${artist||'Unknown Artist'}</p></div>`;

    const choose=()=>useSong({title,artist,cover,link}, div);
    div.onclick=choose;
    div.onkeyup=e=>{ if(e.key==='Enter'||e.key===' ') choose(); };
    resultsEl.appendChild(div);
  });
}

function showSelectedCard({title,artist,cover}){
  if(cover){
    const img=document.createElement('img');
    img.src=cover;
    img.alt='Album cover';
    img.className='sel-cover';
    img.loading='lazy';
    img.decoding='async';
    if(selCoverEl) selCoverEl.replaceWith(img);
    selCoverEl=img;
  } else {
    if(!selCoverEl || selCoverEl.tagName.toLowerCase()==='img'){
      const box=document.createElement('div');
      box.id='selCover';
      box.className='sel-cover';
      box.setAttribute('aria-hidden','true');
      box.textContent='♪';
      if(selCoverEl) selCoverEl.replaceWith(box);
      selCoverEl=box;
    }
  }
  selTitle.textContent=title||'Unknown Title';
  selArtist.textContent=artist||'Unknown Artist';
  selectedBox.style.display='block';
  selectedBox.classList.add('active');
}

function useSong({title,artist,cover,link}, el){
  document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));
  el?.classList.add('selected');
  titleInput.value = title || '';
  artistInput.value = artist || '';
  linkInput.value = link || '';
  showSelectedCard({title,artist,cover});
  hideResults();
}

let debounce=null, lastTerm='';

q.addEventListener('input', ()=>{
  if (!EVENT_IS_ACTIVE) return;

  const raw=q.value;
  if(raw.length>=1) clearBtn.classList.add('show'); else clearBtn.classList.remove('show');
  const t=raw.trim();
  if(t===lastTerm) return;
  lastTerm=t;
  clearTimeout(debounce);
  debounce=setTimeout(async()=>{
    if(!t){ setStatus(''); hideResults(); return; }
    setStatus('Searching…');
    let list=await searchITunes(t);
    if(!list.length) list=await searchDeezer(t);
    if(!list.length) list=await searchMB(t);
    if(list.length) render(list); else { setStatus('No results'); hideResults(); }
  }, 240);
});

q.addEventListener('keydown', e=>{
  if (!EVENT_IS_ACTIVE) return;

  if(e.key==='Enter'){
    e.preventDefault();
    const t=q.value.trim();
    if(!t) return;
    setStatus('Searching…');
    (async()=>{
      let list=await searchITunes(t);
      if(!list.length) list=await searchDeezer(t);
      if(!list.length) list=await searchMB(t);
      if(list.length) render(list); else { setStatus('No results'); hideResults(); }
    })();
  }
});

clearBtn.addEventListener('click', ()=>{
  if (!EVENT_IS_ACTIVE) return;

  q.value='';
  lastTerm='';
  clearBtn.classList.remove('show');
  setStatus('');
  hideResults();
  hideSelected();
  titleInput.value='';
  artistInput.value='';
  linkInput.value='';
  q.focus({preventScroll:true});
});

function openSuccessModal(){
  tyOverlay.dataset.state = 'success';
  tyIcon.textContent = '✓';
  tyTitle.textContent = 'Got it!';
  tySub.textContent = 'If it fits the flow, we’ll get it on. Let’s party.';
  tyActions.style.display = 'none';
  tyOverlay.style.display = 'flex';
}

function openDeniedModal(message){
  tyOverlay.dataset.state = 'denied';
  tyIcon.textContent = '✕';
  tyTitle.textContent = 'Request Denied';
  tySub.textContent = message || 'Looks like that song was already sent recently from this device.';
  tyActions.style.display = 'block';
  tyOverlay.style.display = 'flex';
}

function closeModal(){
  tyOverlay.style.display='none';
  tyActions.style.display='none';
}

tyActionBtn.addEventListener('click', () => {
  closeModal();
});

function setBtnLoading(on){
  if(on){
    submitBtn.classList.add('loading');
    submitBtn.setAttribute('disabled','disabled');
    btnTxt.textContent='Sending…';
  } else {
    submitBtn.classList.remove('loading');
    if (EVENT_IS_ACTIVE) {
      submitBtn.removeAttribute('disabled');
      btnTxt.textContent='SUBMIT';
    } else {
      submitBtn.setAttribute('disabled','disabled');
      btnTxt.textContent='REQUESTS CLOSED';
    }
  }
}

function resetForm(){
  nameInput.value='';
  q.value='';
  lastTerm='';
  clearBtn.classList.remove('show');
  setStatus('');
  hideResults();
  hideSelected();
  titleInput.value='';
  artistInput.value='';
  linkInput.value='';
}

function redirectBack(){
  const base=location.origin+location.pathname;
  const params=new URLSearchParams();
  if (EVENT_CODE) params.set('event',EVENT_CODE);
  const next=params.toString() ? `${base}?${params.toString()}` : base;
  location.replace(next);
}

async function writeRequest(){
  const nameVal=(nameInput.value||'').trim();
  const titleVal=(titleInput.value||'').trim();
  const artistVal=(artistInput.value||'').trim();
  const linkVal=(linkInput.value||'').trim();
  const normalizedSongKey = buildNormalizedSongKey(titleVal, artistVal);

  if (!titleVal && !artistVal){
    setStatus('Pick a song first.');
    q.focus();
    return;
  }

  if (!EVENT_CODE){
    return;
  }

  const isStillActive = await refreshEventAvailability();
  if (!isStillActive){
    return;
  }

  saveEventCode(EVENT_CODE);
  setBtnLoading(true);

  try{
    const data = await rpc('api_write_request', {
      p_event_code: EVENT_CODE,
      p_requester_name: nameVal,
      p_song_title: titleVal,
      p_artist: artistVal,
      p_link: linkVal,
      p_user_agent: navigator.userAgent,
      p_referrer: document.referrer || location.href,
      p_client_token: CLIENT_TOKEN,
      p_session_token: SESSION_TOKEN,
      p_normalized_song_key: normalizedSongKey
    });

    setBtnLoading(false);

    const row = Array.isArray(data) ? data[0] : null;
    if (!row || row.ok !== true){
      setStatus('Unable to submit request.', true);
      return;
    }

    if (row.accepted === false){
      openDeniedModal(row.user_message || 'Looks like that song was recently submitted from this device.');
      return;
    }

    openSuccessModal();
    setTimeout(()=>{
      resetForm();
      redirectBack();
    }, REDIRECT_DELAY_MS);

  }catch(err){
    setBtnLoading(false);
    setStatus('Unable to submit request. Please try again.', true);
  }
}

submitBtn.addEventListener('click', writeRequest);

window.addEventListener('load', async ()=>{
  if (DEBUG) showDebug();
  const isActive = await refreshEventAvailability();
  if (isActive){
    nameInput.focus({preventScroll:true});
  }
});
</script>
</body>
